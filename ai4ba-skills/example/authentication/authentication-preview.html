<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — SRS Preview</title>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
  <style>
    :root {
      --color-primary: #FCD535;
      --color-canvas: #ffffff;
      --color-surface: #fafafa;
      --color-surface-strong: #f3f3f5;
      --color-ink: #181a20;
      --color-muted: #707a8a;
      --color-hairline: #eaecef;
      --color-link: #2563eb;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-body);
      color: var(--color-ink);
      background: var(--color-surface);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }
    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }
    aside {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      overflow-y: auto;
      background: var(--color-canvas);
      border-right: 1px solid var(--color-hairline);
      padding: 24px 16px;
    }
    aside h2 { font-size: 14px; text-transform: uppercase; color: var(--color-muted); margin: 0 0 12px; letter-spacing: .03em; }
    aside nav ol, aside nav ul { list-style: none; padding: 0; margin: 0; }
    .toc-controls { display: flex; gap: 6px; margin-bottom: 12px; }
    .toc-controls button {
      flex: 1; font-size: 11px; color: var(--color-muted); background: var(--color-surface);
      border: 1px solid var(--color-hairline); border-radius: 6px; padding: 5px 8px; cursor: pointer;
    }
    .toc-controls button:hover { background: var(--color-surface-strong); color: var(--color-ink); }
    /* TOC nested đa cấp (H2→H3→H4) — thụt lề + cỡ chữ theo cấp. */
    aside nav li.toc-item { list-style: none; }
    aside nav li.toc-item > .toc-row { display: flex; align-items: flex-start; border-radius: 6px; }
    aside nav li.toc-item > .toc-row:hover { background: var(--color-surface); }
    aside nav li.toc-item > .toc-row > a { flex: 1; display: block; text-decoration: none; padding: 5px 8px; line-height: 1.4; }
    aside nav .toc-children { margin: 0; padding: 0; }
    aside nav li.collapsed > .toc-children { display: none; }
    /* Cấp 2 (section chính) */
    aside nav > li.toc-item { margin-top: 12px; }
    aside nav > li.toc-item:first-child { margin-top: 0; }
    aside nav > li.toc-item[data-level="2"] > .toc-row > a { font-weight: 600; font-size: 13px; color: var(--color-ink); }
    aside nav > li.toc-item[data-level="2"].active > .toc-row { background: var(--color-primary); }
    /* Cấp 3 */
    aside nav li.toc-item[data-level="3"] { margin-left: 12px; border-left: 2px solid var(--color-hairline); }
    aside nav li.toc-item[data-level="3"] > .toc-row > a { font-size: 12px; color: var(--color-muted); }
    /* Cấp 4 */
    aside nav li.toc-item[data-level="4"] { margin-left: 22px; border-left: 2px solid var(--color-hairline); }
    aside nav li.toc-item[data-level="4"] > .toc-row > a { font-size: 11.5px; color: var(--color-muted); opacity: .9; }
    aside nav li.toc-item.active > .toc-row > a { color: var(--color-ink); font-weight: 600; }
    aside nav .toggle { cursor: pointer; user-select: none; color: var(--color-muted); width: 14px; flex: 0 0 14px; text-align: center; padding-top: 5px; transition: transform .15s; }
    aside nav .toggle.leaf { visibility: hidden; }
    aside nav li.collapsed > .toc-row > .toggle { transform: rotate(-90deg); }
    main { padding: 40px 60px; max-width: 1100px; }
    main h1 { font-size: 32px; border-bottom: 2px solid var(--color-ink); padding-bottom: 12px; }
    main h2 { font-size: 24px; margin-top: 40px; border-bottom: 1px solid var(--color-hairline); padding-bottom: 6px; }
    main h3 { font-size: 18px; margin-top: 28px; color: var(--color-ink); }
    main h4 { font-size: 16px; margin-top: 20px; }
    main p, main li { font-size: 14px; }
    main code { font-family: var(--font-mono); font-size: 13px; background: var(--color-surface); padding: 2px 6px; border-radius: 4px; }
    main pre { background: var(--color-surface); border: 1px solid var(--color-hairline); border-radius: 8px; padding: 16px; overflow-x: auto; font-size: 13px; }
    main pre.mermaid { background: var(--color-canvas); text-align: center; }
    main .mermaid svg { cursor: zoom-in; transition: filter .15s; max-width: 100%; }
    main img.embedded-img { display: block; max-width: 100%; height: auto; margin: 16px auto; }
    main .mermaid svg:hover { filter: drop-shadow(0 0 6px rgba(252, 213, 53, .5)); }
    main table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }
    main th, main td { border: 1px solid var(--color-hairline); padding: 8px 12px; text-align: left; vertical-align: top; }
    main th { background: var(--color-surface); font-weight: 600; }
    main a { color: var(--color-link); text-decoration: none; }
    main a:hover { text-decoration: underline; }
    main hr { border: none; border-top: 1px solid var(--color-hairline); margin: 32px 0; }
    main blockquote { border-left: 4px solid var(--color-primary); margin: 16px 0; padding: 8px 16px; background: var(--color-surface); color: var(--color-muted); }
    main details.inline-screen { border: 1px solid var(--color-hairline); border-radius: 8px; padding: 0; margin: 16px 0; background: var(--color-canvas); overflow: hidden; }
    main details.inline-screen[open] { box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    main details.inline-screen > summary { cursor: pointer; padding: 12px 16px; background: var(--color-surface); font-size: 14px; user-select: none; border-bottom: 1px solid transparent; }
    main details.inline-screen[open] > summary { border-bottom-color: var(--color-hairline); }
    main details.inline-screen > summary:hover { background: var(--color-surface-strong); }
    main details.inline-screen > summary code { background: var(--color-canvas); border: 1px solid var(--color-hairline); }
    main details.inline-screen > *:not(summary) { padding-left: 16px; padding-right: 16px; }
    main details.inline-screen pre { margin: 8px 0; }
    .wf-src-tag { font-size: 10px; font-weight: 700; color: #fff; background: #000; border-radius: 3px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
    /* HTML wireframe embed — CSS chi tiết đến từ style GỐC của file wireframe (scope .wf-embed,
       xem extract_scoped_wireframe_css) nên font-size/spacing GIỐNG bản /wireframe-html. Ở đây chỉ
       reset kế thừa + layout container để không bị body preview đè. */
    main .wf-embed { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #000; font-size: 12px; line-height: 1.4; }
    main .wf-embed * { box-sizing: border-box; }
    main .wf-embed .wf-screen { display: inline-block; vertical-align: top; max-width: 100%; }
    main .wf-embed .wf-step-badge { display: none; }
    .meta { color: var(--color-muted); font-size: 13px; margin-bottom: 24px; }
    /* Cover page (export) — khối bìa căn giữa, viền dưới ngăn cách với nội dung. */
    main .cover { text-align: center; padding: 48px 24px 40px; margin-bottom: 24px; border-bottom: 2px solid var(--color-hairline); }
    main .cover h1 { border: none; font-size: 34px; }
    main .cover h2 { border: none; color: var(--color-muted); font-weight: 500; font-size: 17px; margin-top: 4px; }
    main .cover p { font-size: 15px; line-height: 2; }

    /* Mermaid zoom modal */
    .mermaid-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center;
      z-index: 9999; animation: fadeIn 0.2s ease-out;
    }
    .mermaid-modal.open { display: flex; }
    .modal-svg {
      width: 95vw; height: 90vh; border-radius: 8px;
      background: var(--color-canvas); padding: 2rem; box-sizing: border-box;
      overflow: hidden;
    }
    .modal-svg svg { display: block; max-width: none !important; max-height: none !important; width: 100% !important; height: 100% !important; }
    .modal-toolbar {
      position: fixed; top: 1rem; right: 1rem; display: flex; gap: 0.5rem; z-index: 10000;
    }
    .modal-toolbar button {
      width: 40px; height: 40px; background: var(--color-canvas); border: 1px solid var(--color-hairline);
      border-radius: 6px; font-size: 1.2rem; cursor: pointer; color: var(--color-ink);
    }
    .modal-toolbar button:hover { background: var(--color-surface); }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

    footer { padding: 24px 60px; border-top: 1px solid var(--color-hairline); color: var(--color-muted); font-size: 13px; background: var(--color-canvas); }
    footer code { font-family: var(--font-mono); background: var(--color-surface); padding: 2px 6px; border-radius: 4px; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--color-hairline); }
      main { padding: 24px; }
      footer { padding: 16px 24px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <h2>Authentication</h2>
      <div class="meta">SRS Preview · 2026-07-20</div>
      <nav>
        <div class="toc-controls">
          <button type="button" onclick="setAllTocCollapsed(false)">Expand all</button>
          <button type="button" onclick="setAllTocCollapsed(true)">Collapse all</button>
        </div>
        <ol id="toc"></ol>
      </nav>
    </aside>
    <main id="content"></main>
  </div>

  <!-- Mermaid zoom modal -->
  <div id="mermaid-modal" class="mermaid-modal" onclick="if(event.target===this)closeMermaidModal()">
    <div class="modal-toolbar">
      <button onclick="modalPanZoom && modalPanZoom.zoomIn()" title="Zoom in">＋</button>
      <button onclick="modalPanZoom && modalPanZoom.zoomOut()" title="Zoom out">－</button>
      <button onclick="modalPanZoom && (modalPanZoom.resetZoom(), modalPanZoom.center(), modalPanZoom.fit())" title="Reset">⟲</button>
      <button onclick="closeMermaidModal()" title="Close (ESC)">✕</button>
    </div>
    <div class="modal-svg"></div>
  </div>

  <footer><p>Workflow: edit MD source → save → chạy <code>python3 _scripts/build-preview.py authentication</code> để regen → refresh browser.</p></footer>

  <script>
    const OFFLINE = false;
    let modalPanZoom = null;

    // === Markdown parsing (CHỈ online — offline đã render sẵn server-side) ===
    if (!OFFLINE) {
      const MD_SOURCE = "# Authentication — SRS Preview\n\n> Active work viewer · Generated 2026-07-20\n\n## 1. Tổng quan nhanh\n\n> Liếc nhanh quy mô SRS. Chi tiết từng mục ở section **SRS Spec** bên dưới.\n\n| Loại | Số lượng |\n|---|---|\n| Functional Requirements (FR) | 31 (P0: 26 / P1: 5) |\n| Non-Functional Requirements (NFR) | 9 |\n| Business Rules (BR) | 11 |\n| Error codes | 10 |\n| Success Criteria | 5 |\n| Actors | 8 |\n| Screens | 9 |\n\n\n## 2. Giới thiệu & Mô tả chung\n\n### Definitions / Glossary\n\n## Glossary\n| Thuật ngữ | Định nghĩa | Xuất hiện ở | Aliases |\n|---|---|---|---|\n| **Learner (Người học)** | Người dùng cuối của app — học/ôn tiếng Anh. Là persona chính. Thay cho \"User\" (dùng \"Learner\" thống nhất). | authentication, payment, premium-payment, vocabulary-flashcard | User, Student (tránh dùng) |\n| **Admin** | Người dùng có quyền nâng cao (quản trị). Phân biệt với Learner. | — | — |\n| **Premium** | Gói trả phí mở khóa tính năng nâng cao — mua một lần hoặc thuê bao tháng/năm. | payment, premium-payment, group, vocabulary-flashcard | — |\n| **PayGate** | Cổng thanh toán đối tác (mô hình kiểu Stripe: customers/cards/charges/subscriptions/refunds). App uỷ thác toàn bộ thu thẻ + thuê bao tự gia hạn cho PayGate. Không dùng Sepay/Stripe. | payment, premium-payment | — |\n| **MailGate** | Dịch vụ gửi email đối tác — biên nhận thanh toán, cảnh báo, email hệ thống. | payment, premium-payment | — |\n| **Session (Phiên đăng nhập)** | Phiên một thiết bị đã đăng nhập. Không giới hạn số thiết bị, không tự hết hạn. Đặt lại mật khẩu thu hồi mọi phiên (BR-authentication-008); đăng xuất chỉ tác động thiết bị hiện tại. | authentication, vocabulary-flashcard | — |\n| **OAuth (Đăng nhập Google)** | Đăng nhập bằng tài khoản bên thứ ba (Google). Tự liên kết với tài khoản email trùng (account linking). | authentication | — |\n| **Onboarding** | Màn thiết lập hiển thị sau khi Learner đăng nhập lần đầu, trước khi vào app chính. | authentication, vocabulary-flashcard | — |\n| **Flashcard / Card (Thẻ)** | Thẻ lật từ vựng. Vòng đời trạng thái: `learning → review → mastered` theo lịch ôn. | vocabulary-flashcard, group | — |\n| **Deck (Bộ thẻ)** | Bộ thẻ từ vựng. System deck (do hệ thống cung cấp, Learner clone được) và user deck (tự tạo hoặc import từ file JSON). | vocabulary-flashcard | — |\n| **SRS / Spaced Repetition (Lặp lại ngắt quãng)** | Thuật toán xếp lịch ôn: hệ thống tự tính interval và sắp thẻ cần ôn theo ngày, dựa trên mức nhớ Learner tự đánh giá. | vocabulary-flashcard | — |\n| **Mức nhớ: Nhớ rõ / Nhớ mờ / Chưa nhớ** | 3 bậc Learner tự chấm sau mỗi lần ôn thẻ: - **Nhớ rõ** — interval tăng; đạt 7 ngày liên tục → chuyển `review`, ≥30 ngày → `mastered`. - **Nhớ mờ** — interval hiện tại × 1.5 (tối thiểu 1 ngày). - **Chưa nhớ** — reset về hôm nay (ôn lại ngay/sáng sớm mai), hạ trạng thái về `learning`. | vocabulary-flashcard | — |\n| **CEFR** | Khung tham chiếu trình độ tiếng Anh A1–C2. Deck hệ thống phân loại theo mức này (A1–B2 ở MVP). | vocabulary-flashcard | — |\n| **Subscription (Thuê bao)** | Gói Premium trả phí định kỳ tự gia hạn (tháng/năm) qua PayGate. Khi một lần thu (Charge) của thuê bao thất bại → gửi email cảnh báo, sau 3 ngày hạ về Free. Learner xem kỳ gia hạn + hủy bất cứ lúc nào. | premium-payment | — |\n| **Charge (Lần thu thẻ)** | Một lần thu tiền qua thẻ trên PayGate — mua Premium một lần hoặc kỳ gia hạn của thuê bao. Charge `succeeded` thì kích hoạt Premium; `failed` thì hiện màn lỗi theo từng loại lỗi thẻ. | premium-payment | — |\n| **Refund (Hoàn tiền)** | Trả lại tiền của một Charge đã thu qua PayGate. Đây là tính năng mức ưu tiên thấp (P2). | premium-payment | — |\n| **Lockout (Khóa tạm tài khoản)** | Cơ chế chống dò mật khẩu: sau ≥5 lần đăng nhập sai, tài khoản bị khóa tạm thời, Learner phải chờ trước khi thử lại. Khác với account `locked` vĩnh viễn do Admin. | authentication | — |\n\n---\n\n### Operating Environment\n\n#### Nền tảng đích\n\n- **Web responsive** (desktop + mobile), một codebase phục vụ cả 2.\n- Mobile breakpoint nhỏ nhất **375px** (iPhone SE). Test 2 viewport phổ biến: **375×667** và **414×896**.\n- Tablet: chưa cam kết riêng (responsive web tự co giãn).\n\n#### Trình duyệt hỗ trợ\n\n- Chrome, Safari, Firefox, Edge — **2 phiên bản major mới nhất**.\n- Mobile: **iOS Safari** + **Android Chrome**.\n\n#### Lưu ý mobile (rút từ test suite authentication)\n\n- Font input **≥16px** để tránh iOS auto-zoom khi focus.\n- Touch target **≥44px** (nút, link).\n- Bàn phím mobile **không che** field đang focus (auto-scroll khi focus).\n- Mọi form **không scroll ngang** ở viewport mobile.\n\n#### Người dùng & ngôn ngữ\n\n- Người dùng chính: **Learner** học/ôn tiếng Anh (xem **Learner-Người-học**).\n- Giao diện **tiếng Việt mặc định**. Toàn bộ wording lỗi/thành công/thông tin bằng tiếng Việt (NFR-authentication-005).\n\n#### Đối tác tích hợp ngoài\n\n| Đối tác | Vai trò |\n|---------|---------|\n| **PayGate** | Thu thẻ một lần (Charge), thuê bao tự gia hạn (Subscription), hoàn tiền (Refund), polling events |\n| **MailGate** | Email giao dịch: biên nhận, cảnh báo thanh toán thất bại, email xác nhận |\n| **Google OAuth** | Đăng nhập/đăng ký bằng tài khoản Google + auto-link theo email |\n\n#### Giả định mạng & phiên\n\n- **Online-first.**\n- Đăng nhập **đa thiết bị**, không giới hạn số phiên, phiên **không tự hết hạn**.\n- Đặt lại mật khẩu thu hồi mọi phiên (BR-authentication-008); đăng xuất chỉ tác động thiết bị hiện tại.\n\n#### Bảo mật vận hành\n\n- Khóa đối tác (PayGate/MailGate) lưu ở **secret store phía server** — KHÔNG nhúng client, KHÔNG log (NFR-premium-payment-004).\n- Mật khẩu lưu dạng hash, không bao giờ log plaintext; audit log mọi sự kiện auto-link social (NFR-authentication-001).\n\n---\n\n### Conventions\n\n#### Standard page elements\n- Page max width: 1200px\n- Required field marker: `*`\n- Currency format: `#,###,###.## VND` (or your locale)\n\n#### Notation in docs\n- `Required` field labels in tables\n- `Default: X` for default values\n- `Max: N chars` for length limits\n\n\n## <a id=\"sec-spec\"></a>3. SRS Spec\n\n### 1. Scope\n\nSRS này cover luồng xác thực nền tảng của app học tiếng Anh **english-ai-demo** cho khu vực Đông Nam Á (VN, SG, TH, ID, MY, PH), gồm 2 phương thức: đăng ký/đăng nhập bằng email + mật khẩu (kèm xác nhận email bắt buộc, quên mật khẩu, remember-me) và đăng ký/đăng nhập bằng tài khoản Google (OAuth). Cover thêm: tự động liên kết tài khoản trùng email, gỡ liên kết Google, đăng nhập nhiều thiết bị, và bảo vệ chống dò mật khẩu (captcha + khóa tạm).\n\n**KHÔNG cover:**\n\n- Apple Sign-In, Facebook Login, và mọi nhà cung cấp OAuth khác ngoài Google.\n- Magic link / đăng nhập không mật khẩu (passwordless).\n- SSO doanh nghiệp (SAML/OIDC nội bộ tổ chức).\n- Ứng dụng native iOS/Android (chỉ responsive webapp — mobile + desktop browser).\n- Xóa tài khoản / đổi địa chỉ email (PDPA SEA không bắt buộc — out of scope theo quyết định brainstorm).\n- Quản lý gói trả phí / trạng thái subscription (thuộc feature `onboarding`/billing riêng — auth chỉ xác định danh tính, không xử lý subscription).\n- Onboarding sau đăng nhập lần đầu (feature `onboarding` riêng, phát triển sau).\n\n### 2. Actors & Stakeholders\n\n| Actor | Loại (người/hệ thống/ngoài) | Mục tiêu | Trong scope? |\n|-------|-----------------------------|----------|--------------|\n| Học viên miễn phí (Free learner) | người | Tạo tài khoản nhanh, nhẹ để đồng bộ tiến độ học qua nhiều thiết bị | Có |\n| Học viên trả phí (Paid learner) | người | Đăng nhập ổn định trên nhiều thiết bị, không bị đăng xuất bất ngờ để giữ quyền paid | Có |\n| Người dùng quay lại (Returning user) | người | Đăng nhập lại; nếu quên mật khẩu thì đặt lại đơn giản qua email | Có |\n| Người dùng ưu tiên Google (Google-first user) | người | Đăng ký/đăng nhập một chạm bằng Google, không phải tạo mật khẩu mới | Có |\n| Dịch vụ gửi email (transactional) | hệ thống ngoài | Gửi email chứa link xác nhận + link đặt lại mật khẩu tới hộp thư người dùng | Có (dùng theo SLA nhà cung cấp, không đặc tả tích hợp kỹ thuật) |\n| Google OAuth | hệ thống ngoài | Xác thực danh tính Google của người dùng và trả email đã xác thực về app | Có (dùng theo điều khoản/hạn mức Google, không đặc tả tích hợp kỹ thuật) |\n| Bộ phận vận hành / hỗ trợ | người | Xử lý khiếu nại tài khoản bị khóa, email không tới; theo dõi cảnh báo liên kết Google bất thường | Có (thao tác hỗ trợ ngoài luồng tự động; khóa/mở khóa là tự động 24h) |\n| Bộ phận bảo mật / pháp lý | người | Chốt chuẩn lưu trữ mật khẩu + yêu cầu tuân thủ PDPA/Nghị định 13 | Không (nguồn ràng buộc, không thao tác trong luồng — xem Mục 11) |\n\n### 3. Functional Requirements (FR)\n\n| ID | Title | Description | Priority | Verify by | Source |\n|----|-------|-------------|----------|-----------|--------|\n| FR-authentication-001 | Đăng ký bằng email + mật khẩu | Khi người dùng gửi form đăng ký với email + mật khẩu hợp lệ và email chưa tồn tại, hệ thống phải tạo tài khoản ở trạng thái `unverified` | P0 | demo | Brainstorm Mục 4 P0 |\n| FR-authentication-002 | Chặn đăng ký email trùng | Nếu email đã tồn tại trong hệ thống khi đăng ký, thì hệ thống phải chặn tạo tài khoản và hiện thông báo gợi ý đăng nhập hoặc quên mật khẩu | P0 | test | Brainstorm Mục 6.1 D1 |\n| FR-authentication-003 | Áp chính sách mật khẩu | Khi người dùng nhập mật khẩu, hệ thống phải chấp nhận chỉ khi mật khẩu dài 8-20 ký tự, có ít nhất 1 chữ hoa, 1 chữ thường và 1 ký tự đặc biệt, và không chứa phần đầu email (local-part, ≥3 ký tự, không phân biệt hoa/thường) | P0 | test | Brainstorm Mục 7.1 |\n| FR-authentication-004 | Gửi email xác nhận | Khi tài khoản email được tạo, hệ thống phải gửi email chứa link xác nhận có hạn 24 giờ tới địa chỉ đã đăng ký | P0 | test | Brainstorm Mục 4 P0, Mục 5.1 |\n| FR-authentication-005 | Xác nhận email qua link | Khi người dùng bấm link xác nhận còn hạn và chưa dùng, hệ thống phải chuyển tài khoản sang `verified` và đánh dấu link đã dùng | P0 | test | Brainstorm Mục 5.2, 6.3 |\n| FR-authentication-006 | Chặn link xác nhận hết hạn/đã dùng | Nếu link xác nhận đã hết hạn hoặc đã được dùng, thì hệ thống phải từ chối và mời người dùng gửi lại link | P0 | test | Brainstorm Mục 6.1 D8 |\n| FR-authentication-007 | Gửi lại email xác nhận | Khi người dùng yêu cầu gửi lại email xác nhận, hệ thống phải gửi lại link mới, tôn trọng cooldown 60 giây giữa 2 lần và tối đa 5 lần/ngày | P0 | test | Brainstorm Mục 4 P0, Mục 7.2 |\n| FR-authentication-008 | Đăng nhập bằng email + mật khẩu | Khi người dùng gửi email + mật khẩu khớp với tài khoản đã verified và không bị khóa, hệ thống phải tạo phiên đăng nhập và cho vào app | P0 | demo | Brainstorm Mục 5.3 |\n| FR-authentication-009 | Chặn đăng nhập tài khoản chưa xác nhận | Nếu tài khoản email đúng mật khẩu nhưng chưa `verified`, thì hệ thống phải chặn vào app và mời gửi lại email xác nhận | P0 | test | Brainstorm Mục 6.1 D4 |\n| FR-authentication-010 | Thông báo đăng nhập sai chung | Nếu email hoặc mật khẩu không khớp, thì hệ thống phải hiện thông báo chung \"Email hoặc mật khẩu không đúng\" (không tiết lộ email nào tồn tại) và tăng bộ đếm sai +1 | P0 | test | Brainstorm Mục 6.1 D3 |\n| FR-authentication-011 | Remember-me 30 ngày | Khi người dùng bật remember-me lúc đăng nhập, hệ thống phải giữ phiên đăng nhập 30 ngày trên thiết bị đó; mặc định remember-me tắt | P0 | test | Brainstorm Mục 4 P0, Mục 7.2 |\n| FR-authentication-012 | Đăng nhập/đăng ký bằng Google | Khi người dùng chọn đăng nhập bằng Google và Google trả về thành công email đã xác thực, hệ thống phải xác định người dùng qua email đó (1 luồng duy nhất cho cả đăng ký lẫn đăng nhập, không hỏi thêm field ngoài dữ liệu Google trả) | P0 | demo | Brainstorm Mục 5.4 |\n| FR-authentication-013 | Tạo tài khoản mới từ Google | Nếu email Google chưa tồn tại trong hệ thống, thì hệ thống phải tạo tài khoản mới ở trạng thái `verified` (Google đã xác thực email) | P0 | test | Brainstorm Mục 5.4, 6.1 D6 |\n| FR-authentication-014 | Tự động liên kết Google trùng email | Nếu email Google trùng với một tài khoản đã tồn tại, thì hệ thống phải tự liên kết Google vào tài khoản đó, đánh dấu `verified` và đăng nhập — không tạo tài khoản trùng, không yêu cầu nhập mật khẩu cũ | P0 | test | Brainstorm Mục 4 P0, Mục 6.1 D6 |\n| FR-authentication-015 | Xử lý callback Google thất bại | Nếu callback Google thất bại (mạng/lỗi Google/người dùng hủy), thì hệ thống phải hiện \"Đăng nhập Google thất bại, thử lại\" và không tạo tài khoản dở dang | P0 | test | Brainstorm Mục 5.4, 6.4 |\n| FR-authentication-016 | Yêu cầu đặt lại mật khẩu | Khi người dùng gửi email ở form quên mật khẩu, hệ thống phải hiện thông báo trung tính \"Nếu email tồn tại trong hệ thống, đã gửi link đặt lại\" bất kể email có tồn tại hay không (chống dò tài khoản) | P0 | test | Brainstorm Mục 5.5, 6.1 D7 |\n| FR-authentication-017 | Gửi link đặt lại mật khẩu | Khi email quên mật khẩu khớp một tài khoản tồn tại, hệ thống phải gửi email chứa link đặt lại có hạn 30 phút | P0 | test | Brainstorm Mục 5.5, 7.2 |\n| FR-authentication-018 | Đặt mật khẩu mới qua link | Khi người dùng bấm link đặt lại còn hạn, chưa dùng, và nhập mật khẩu mới đạt chính sách (nhập 2 lần khớp), hệ thống phải cập nhật mật khẩu và đánh dấu link đã dùng | P0 | test | Brainstorm Mục 5.5 |\n| FR-authentication-019 | Đăng xuất mọi phiên sau đặt lại | Khi mật khẩu được đặt lại thành công, hệ thống phải thu hồi mọi phiên đăng nhập trên tất cả thiết bị và buộc người dùng đăng nhập lại | P0 | test | Brainstorm Mục 5.5, 6.1 (OQ-2 resolved) |\n| FR-authentication-020 | Chặn link đặt lại hết hạn/đã dùng | Nếu link đặt lại đã hết hạn hoặc đã được dùng, thì hệ thống phải từ chối và mời người dùng yêu cầu link mới qua \"Quên mật khẩu\" | P0 | test | Brainstorm Mục 6.1 D8 |\n| FR-authentication-021 | Đăng nhập nhiều thiết bị | Hệ thống phải cho phép một tài khoản đăng nhập đồng thời trên nhiều thiết bị, không giới hạn số thiết bị và không tự hết hạn phiên | P0 | test | Brainstorm Mục 4 P0 |\n| FR-authentication-022 | Đăng xuất thiết bị hiện tại | Khi người dùng chọn đăng xuất, hệ thống phải thu hồi phiên của thiết bị hiện tại mà không ảnh hưởng phiên trên thiết bị khác, không hiện hộp thoại xác nhận | P0 | demo | Brainstorm Mục 5.6 |\n| FR-authentication-023 | Gỡ liên kết Google | Khi người dùng gỡ liên kết Google và tài khoản đã có mật khẩu, hệ thống phải gỡ liên kết Google và giữ khả năng đăng nhập bằng email/mật khẩu | P0 | test | Brainstorm Mục 4 P0, Mục 6.1 D9 (OQ-6 resolved) |\n| FR-authentication-024 | Buộc đặt mật khẩu trước khi gỡ Google | Nếu người dùng gỡ liên kết Google mà tài khoản chưa có mật khẩu (đăng ký gốc qua Google), thì hệ thống phải buộc tạo mật khẩu đạt chính sách trước, rồi mới gỡ liên kết | P0 | test | Brainstorm Mục 4 P0, Mục 6.1 D9 |\n| FR-authentication-025 | Captcha sau 3 lần đăng nhập sai | Khi một tài khoản có từ 3 lần đăng nhập sai liên tiếp, hệ thống phải yêu cầu captcha ở các lần thử tiếp theo | P0 | test | Brainstorm Mục 4 P0, Mục 7.2 |\n| FR-authentication-026 | Khóa tài khoản sau 5 lần sai | Khi một tài khoản có từ 5 lần đăng nhập sai liên tiếp, hệ thống phải khóa tài khoản 24 giờ và tự mở khóa sau đó (không cần vận hành can thiệp) | P0 | test | Brainstorm Mục 4 P0, Mục 7.2 |\n| FR-authentication-027 | Không tính lỗi mạng vào bộ đếm sai | Nếu một lần đăng nhập thất bại do lỗi mạng (không phải sai mật khẩu), thì hệ thống phải không tăng bộ đếm sai | P1 | test | Brainstorm Mục 6.4 |\n| FR-authentication-028 | Tự xóa tài khoản chưa xác nhận | Khi một tài khoản ở trạng thái `unverified` quá 24 giờ, hệ thống phải tự xóa tài khoản đó | P1 | test | Brainstorm Mục 7.2, 6.4 |\n| FR-authentication-029 | Đo độ mạnh mật khẩu real-time | Khi người dùng nhập mật khẩu ở form đăng ký/đặt lại, hệ thống nên hiển thị mức độ mạnh của mật khẩu theo thời gian thực | P1 | demo | Brainstorm Mục 4 P1 |\n| FR-authentication-030 | Danh sách thiết bị + đăng xuất từ xa | Hệ thống nên cho người dùng xem danh sách thiết bị đang đăng nhập và đăng xuất thủ công từng thiết bị | P1 | demo | Brainstorm Mục 4 P1 |\n| FR-authentication-031 | Captcha chống bot khi đăng ký | Hệ thống nên yêu cầu captcha ở form đăng ký để chống đăng ký hàng loạt bằng bot | P1 | test | Brainstorm Mục 4 P1, Mục 9 |\n\n### 4. Non-Functional Requirements (NFR)\n\n| ID | Category | Requirement | Priority | Acceptance |\n|----|----------|-------------|----------|------------|\n| NFR-authentication-001 | performance | Người dùng thấy kết quả sau khi bấm đăng nhập | P0 | 95% trường hợp hiển thị kết quả (vào app hoặc báo lỗi) trong 3 giây |\n| NFR-authentication-002 | availability | Dịch vụ xác thực khả dụng để người dùng đăng nhập/đăng ký | P0 | ≥ 99.9% mỗi tháng trong giờ vận hành |\n| NFR-authentication-003 | security | Mật khẩu là dữ liệu nhạy cảm | P0 | KHÔNG lưu mật khẩu dạng plaintext và KHÔNG ghi mật khẩu vào log; chuẩn lưu trữ/bảo mật cụ thể do bộ phận bảo mật/pháp lý chốt (xem Mục 11) |\n| NFR-authentication-004 | privacy | Tuân thủ luật bảo vệ dữ liệu khu vực Đông Nam Á | P0 | Có chính sách quyền riêng tư đáp ứng PDPA (SG/TH) + Nghị định 13/2023/NĐ-CP (VN) trước khi ra mắt; banner đồng ý cookie; chính sách lưu giữ dữ liệu rõ ràng. KHÔNG áp dụng GDPR (không phục vụ EU) |\n| NFR-authentication-005 | security | Chống dò mật khẩu bằng thử lặp | P0 | Sau 3 lần sai liên tiếp yêu cầu captcha; sau 5 lần sai liên tiếp khóa 24 giờ; lỗi mạng không tính vào bộ đếm |\n| NFR-authentication-006 | usability | Phiên \"ghi nhớ đăng nhập\" duy trì đủ lâu để không phiền người dùng đa thiết bị | P0 | Remember-me giữ phiên 30 ngày, mặc định tắt |\n| NFR-authentication-007 | security | Chống dò sự tồn tại của tài khoản (account enumeration) | P0 | Thông báo quên mật khẩu và đăng nhập sai đều trung tính, không tiết lộ email nào tồn tại |\n| NFR-authentication-008 | compliance | Lưu vết sự kiện xác thực nhạy cảm phục vụ điều tra bảo mật | P1 | Ghi nhật ký (không sửa được) các sự kiện: khóa tài khoản, đặt lại mật khẩu, tự liên kết Google; không chứa mật khẩu; thời hạn lưu giữ do bảo mật/pháp lý chốt |\n| NFR-authentication-009 | usability | Màn xác thực dùng được cho người khiếm thị/khuyết tật cơ bản | P1 | Form đăng nhập/đăng ký hỗ trợ điều hướng bàn phím + nhãn cho trình đọc màn hình ở các trường và nút chính |\n\n### 5. Business Rules\n\n| ID | Rule | Trigger | Implements FR | Source |\n|----|------|---------|---------------|--------|\n| BR-authentication-001 | Phải xác nhận email trước khi truy cập nội dung học (gate access) | Người dùng đăng ký email đăng nhập lần đầu | FR-authentication-004, FR-authentication-009 | Brainstorm Mục 4 P0 |\n| BR-authentication-002 | Email là định danh duy nhất — một email chỉ có một tài khoản, dùng chung cho cả 2 phương thức | Đăng ký email hoặc callback Google | FR-authentication-002, FR-authentication-014 | Brainstorm Mục 8 |\n| BR-authentication-003 | Tài khoản có email trùng với Google được tự liên kết, không tạo trùng và không hỏi mật khẩu cũ | Callback Google với email khớp tài khoản đã có | FR-authentication-014 | Brainstorm Mục 6.1 D6 (OQ-1 resolved) |\n| BR-authentication-004 | Phải có mật khẩu trước khi gỡ liên kết Google (tránh mất lối vào tài khoản) | Người dùng gỡ Google khỏi tài khoản chưa có mật khẩu | FR-authentication-024 | Brainstorm Mục 6.1 D9 (OQ-6 resolved) |\n| BR-authentication-005 | Khóa tài khoản 24 giờ (tự mở) sau 5 lần đăng nhập sai liên tiếp | Bộ đếm sai của một tài khoản đạt 5 | FR-authentication-026 | Brainstorm Mục 7.2 (OQ-8 resolved) |\n| BR-authentication-006 | Yêu cầu captcha sau 3 lần đăng nhập sai liên tiếp | Bộ đếm sai của một tài khoản đạt 3 | FR-authentication-025 | Brainstorm Mục 7.2 (OQ-8 resolved) |\n| BR-authentication-007 | Đặt lại mật khẩu thu hồi toàn bộ phiên trên mọi thiết bị | Đặt lại mật khẩu thành công | FR-authentication-019 | Brainstorm Mục 5.5 (OQ-2 resolved) |\n| BR-authentication-008 | Cùng thông báo cho cả 2 nhánh quên mật khẩu (email tồn tại hay không) — chống account enumeration | Người dùng gửi email ở form quên mật khẩu | FR-authentication-016 | Brainstorm Mục 5.5, 6.1 D7 |\n| BR-authentication-009 | Tài khoản tạo qua Google được coi là `verified` ngay (Google đã xác thực email) | Tạo tài khoản mới từ callback Google | FR-authentication-013 | Brainstorm Mục 5.4 |\n| BR-authentication-010 | Tài khoản `unverified` quá 24 giờ bị tự xóa | Tiến trình nền rà tài khoản chưa xác nhận | FR-authentication-028 | Brainstorm Mục 7.2 |\n| BR-authentication-011 | Lỗi mạng khi đăng nhập không tính vào bộ đếm sai | Đăng nhập thất bại do lỗi mạng | FR-authentication-027 | Brainstorm Mục 6.4 |\n\n### 6. Error Matrix\n\n| Error ID | Title | Trigger | Severity | Related FR | Screen state | Recovery |\n|----------|-------|---------|----------|------------|--------------|----------|\n| E-authentication-001 | Email đã được đăng ký | Đăng ký với email đã tồn tại | minor | FR-authentication-002 | Form đăng ký hiện lỗi inline \"Email này đã được đăng ký. Bạn muốn [đăng nhập] hoặc [quên mật khẩu]?\" | Người dùng chuyển sang đăng nhập hoặc quên mật khẩu |\n| E-authentication-002 | Mật khẩu không đạt chính sách | Mật khẩu nhập không thỏa 8-20 ký tự / thiếu loại ký tự / chứa local-part email | minor | FR-authentication-003 | Form hiện lỗi inline real-time \"Mật khẩu cần 8-20 ký tự, có chữ hoa, chữ thường và ký tự đặc biệt, và không chứa phần đầu email của bạn\" | Người dùng sửa lại mật khẩu |\n| E-authentication-003 | Sai email hoặc mật khẩu | Email + mật khẩu không khớp khi đăng nhập | major | FR-authentication-010 | Form đăng nhập hiện \"Email hoặc mật khẩu không đúng\" (chung, không lộ email nào tồn tại); tăng bộ đếm sai +1 | Người dùng thử lại; captcha xuất hiện từ lần thứ 3 |\n| E-authentication-004 | Tài khoản chưa xác nhận | Đăng nhập đúng mật khẩu nhưng tài khoản `unverified` | major | FR-authentication-009 | Form hiện \"Tài khoản chưa được xác nhận. [Gửi lại email xác nhận]\" | Người dùng bấm gửi lại email xác nhận |\n| E-authentication-005 | Tài khoản đang bị khóa | Đăng nhập vào tài khoản đã khóa (≥5 lần sai) | critical | FR-authentication-026 | Form hiện \"Tài khoản tạm khóa do nhiều lần đăng nhập sai. Vui lòng thử lại sau {X} giờ.\" | Chờ tự mở khóa sau 24 giờ; liên hệ hỗ trợ nếu cần |\n| E-authentication-006 | Link xác nhận hết hạn/đã dùng | Bấm link xác nhận đã quá 24 giờ hoặc đã dùng | minor | FR-authentication-006 | Trang kết quả hiện \"Link đã hết hạn hoặc đã được sử dụng. [Gửi lại link xác nhận]\" | Người dùng gửi lại link xác nhận (theo cooldown/giới hạn) |\n| E-authentication-007 | Vượt giới hạn gửi lại email | Bấm gửi lại trong 60 giây cooldown hoặc đã đủ 5 lần/ngày | minor | FR-authentication-007 | Nút gửi lại tạm vô hiệu + thông báo còn thời gian chờ / đã đạt giới hạn ngày | Người dùng chờ hết cooldown hoặc thử lại ngày hôm sau |\n| E-authentication-008 | Đăng nhập Google thất bại | Callback Google lỗi (mạng/Google/người dùng hủy) | major | FR-authentication-015 | Trở về màn đăng nhập, hiện \"Đăng nhập Google thất bại. Vui lòng thử lại.\" (không có tài khoản dở dang) | Người dùng thử lại Google hoặc dùng email/mật khẩu |\n| E-authentication-009 | Link đặt lại mật khẩu hết hạn/đã dùng | Bấm link đặt lại đã quá 30 phút hoặc đã dùng | minor | FR-authentication-020 | Trang kết quả hiện \"Link đã hết hạn. [Quên mật khẩu] lại để nhận link mới.\" | Người dùng yêu cầu link đặt lại mới |\n| E-authentication-010 | Gỡ Google khi chưa có mật khẩu | Yêu cầu gỡ Google trên tài khoản chưa có mật khẩu | major | FR-authentication-024 | Chuyển sang form buộc tạo mật khẩu trước khi cho gỡ liên kết | Người dùng tạo mật khẩu đạt chính sách rồi mới gỡ Google |\n\n### 7. Success Criteria\n\n| ID | Outcome nghiệp vụ | Đo bằng | Mốc đạt |\n|----|-------------------|---------|---------|\n| SC-authentication-01 | Khách hoàn tất đăng ký đến khi tài khoản được xác nhận | Tỷ lệ khách bắt đầu đăng ký → tài khoản đã verified | ≥ 70% |\n| SC-authentication-02 | Người đăng ký email hoàn tất bước xác nhận email | Tỷ lệ email xác nhận được bấm trong 24 giờ / tổng email gửi | ≥ 80% |\n| SC-authentication-03 | Người dùng đăng nhập thành công không bị vướng | Tỷ lệ lần đăng nhập thành công / tổng lần thử (loại lỗi mạng) | ≥ 95% |\n| SC-authentication-04 | Khách chọn Google có trải nghiệm một chạm suôn sẻ | Tỷ lệ luồng Google bắt đầu → vào app thành công | ≥ 90% |\n| SC-authentication-05 | Người quên mật khẩu tự khôi phục được, giảm tải hỗ trợ | Tỷ lệ yêu cầu quên mật khẩu → đặt lại thành công | ≥ 85% |\n\n### 8. Data Entities (tóm tắt — chi tiết ở [erd.md](#sec-erd))\n\n- **Người dùng / Tài khoản (User/Account)** — email (định danh duy nhất), trạng thái (`unverified`/`verified`/`locked`), ngày tạo, thời điểm khóa (nếu có).\n- **Thông tin đăng nhập (Credential)** — thuộc tài khoản, dạng lưu mật khẩu (không plaintext), thời điểm cập nhật gần nhất; có thể trống nếu tài khoản gốc tạo qua Google chưa đặt mật khẩu.\n- **Nhà cung cấp liên kết (LinkedProvider — Google)** — thuộc tài khoản, loại nhà cung cấp (Google), định danh Google, thời điểm liên kết.\n- **Link xác nhận email (VerificationToken)** — thuộc tài khoản, trạng thái (`pending`/`used`/`expired`), thời điểm tạo, hạn 24 giờ.\n- **Link đặt lại mật khẩu (ResetToken)** — thuộc tài khoản, trạng thái (`pending`/`used`/`expired`), thời điểm tạo, hạn 30 phút.\n- **Phiên đăng nhập (Session)** — thuộc tài khoản, thiết bị, trạng thái (`active`/`revoked`), có phải remember-me (30 ngày), thời điểm tạo.\n- **Lần đăng nhập sai (LoginAttempt)** — thuộc tài khoản, thời điểm, đếm sai liên tiếp (dùng cho ngưỡng captcha 3 / khóa 5); lỗi mạng không ghi vào bộ đếm.\n\nChi tiết quan hệ + thuộc tính ở `srs/authentication-erd.md` (chạy `/erd --feature authentication`).\n\n### 9. Flows\n\n> Sequence diagram chi tiết cho từng flow (nguồn: `srs/flows.md`).\n\n#### Flow: Đăng ký email + xác nhận email\n\nLiên quan: FR-authentication-001..007 | Error: E-authentication-001, 002, 006, 007 | Related UC: uc-signup-email, uc-verify-email.\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant Web as Web App\n    participant BE as Backend\n    participant DB as Database\n    participant Mail as Email Service\n\n    User->>Web: Nhập email + mật khẩu, submit\n    Web->>Web: Kiểm tra chính sách mật khẩu (real-time)\n    alt Mật khẩu không đạt chính sách\n        Web-->>User: Lỗi E-authentication-002 inline, không submit\n    else Mật khẩu hợp lệ\n        Web->>BE: Gửi yêu cầu đăng ký\n        BE->>DB: Email đã tồn tại chưa?\n        alt Email đã tồn tại\n            DB-->>BE: Đã có\n            BE-->>Web: Lỗi E-authentication-001\n            Web-->>User: Inline error + gợi ý đăng nhập/quên mật khẩu\n        else Email chưa có\n            DB-->>BE: Chưa có\n            BE->>DB: Tạo Account status=unverified\n            BE->>DB: Tạo VerificationToken pending, hạn 24h\n            BE->>Mail: Gửi email xác nhận (link 24h)\n            BE-->>Web: OK\n            Web-->>User: Đã gửi email xác nhận + nút Gửi lại\n        end\n    end\n\n    opt Gửi lại email xác nhận\n        User->>Web: Bấm Gửi lại\n        Web->>BE: Yêu cầu gửi lại\n        alt Trong cooldown 60s hoặc đã đủ 5 lần/ngày\n            BE-->>Web: Chặn gửi lại (E-authentication-007)\n            Web-->>User: Vui lòng đợi / đã đạt giới hạn ngày\n        else Được phép gửi lại\n            BE->>DB: Tạo VerificationToken mới hạn 24h\n            BE->>Mail: Gửi lại email xác nhận\n            BE-->>Web: OK\n            Web-->>User: Đã gửi lại + reset cooldown 60s\n        end\n    end\n\n    Note over User,Mail: Người dùng mở email, bấm link xác nhận\n    User->>Web: Bấm link xác nhận\n    Web->>BE: Xác minh token\n    BE->>DB: Token còn hạn và chưa dùng?\n    alt Token hợp lệ\n        DB-->>BE: OK\n        BE->>DB: Account sang verified, VerificationToken used\n        BE-->>Web: Thành công\n        Web-->>User: Xác nhận thành công, chuyển sang Login\n    else Token hết hạn hoặc đã dùng\n        DB-->>BE: Không hợp lệ\n        BE-->>Web: Lỗi E-authentication-006\n        Web-->>User: Link hết hạn/đã dùng + nút Gửi lại link\n    end\n```\n\n#### Flow: Đăng nhập email + mật khẩu (kèm captcha/khóa)\n\nLiên quan: FR-authentication-008..011, 021, 022, 025, 026, 027 | Error: E-authentication-003, 004, 005 | Related UC: uc-login-email.\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant Web as Web App\n    participant BE as Backend\n    participant DB as Database\n\n    User->>Web: Nhập email + mật khẩu (tùy chọn remember-me), submit\n    Web->>BE: Gửi yêu cầu đăng nhập\n    BE->>DB: Đọc Account theo email\n    alt Tài khoản đang bị khóa\n        BE-->>Web: Lỗi E-authentication-005 (thử lại sau X giờ)\n        Web-->>User: Hiện inline error\n    else Lỗi mạng khi submit\n        BE-->>Web: Lỗi mạng, không tạo phiên\n        Note over BE: KHÔNG tăng bộ đếm sai (FR-027)\n        Web-->>User: Lỗi kết nối, vui lòng thử lại\n    else Email hoặc mật khẩu không khớp\n        BE->>DB: Tăng bộ đếm sai liên tiếp +1\n        Note over BE: Từ 3 lần sai yêu cầu captcha FR-025, 5 lần khóa 24h FR-026\n        BE-->>Web: Lỗi E-authentication-003 (chung, không lộ email)\n        Web-->>User: Inline error (kèm captcha nếu sai từ 3 lần)\n    else Khớp nhưng chưa verified\n        BE-->>Web: Lỗi E-authentication-004\n        Web-->>User: Inline error + nút Gửi lại email xác nhận\n    else Khớp và đã verified\n        BE->>DB: Reset bộ đếm sai, tạo Session active\n        Note over BE: remember-me=true thì phiên giữ 30 ngày\n        BE-->>Web: OK + phiên\n        Web-->>User: Vào app\n    end\n\n    opt Đăng xuất thiết bị hiện tại\n        User->>Web: Bấm Đăng xuất\n        Web->>BE: Thu hồi phiên thiết bị hiện tại\n        BE->>DB: Session sang revoked (chỉ thiết bị này, FR-022)\n        BE-->>Web: OK\n        Web-->>User: Đăng xuất, không ảnh hưởng thiết bị khác\n    end\n```\n\n#### Flow: Đăng ký/đăng nhập bằng Google (OAuth) + tự liên kết\n\nLiên quan: FR-authentication-012..015 | Error: E-authentication-008 | Related UC: uc-google-oauth.\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant Web as Web App\n    participant BE as Backend\n    participant Google as Google OAuth\n    participant DB as Database\n\n    User->>Web: Bấm \"Đăng nhập với Google\"\n    Web->>Google: Chuyển tới màn hình đồng ý\n    Google-->>Web: Người dùng đồng ý, callback\n    Web->>BE: Gửi kết quả callback\n    BE->>Google: Lấy email đã xác thực\n    alt Callback thất bại (mạng/lỗi Google/người dùng hủy)\n        Google-->>BE: Lỗi\n        BE-->>Web: Lỗi E-authentication-008 (không tạo tài khoản dở dang)\n        Web-->>User: Đăng nhập Google thất bại, thử lại\n    else Callback thành công\n        Google-->>BE: Email đã xác thực\n        BE->>DB: Email Google đã có tài khoản chưa?\n        alt Email đã có tài khoản\n            BE->>DB: Tạo LinkedProvider, đánh dấu verified, ghi nhật ký tự liên kết\n            Note over BE,DB: Tự liên kết, không hỏi mật khẩu cũ (FR-014)\n        else Email chưa có\n            BE->>DB: Tạo Account verified + LinkedProvider (FR-013)\n        end\n        BE->>DB: Tạo Session active\n        BE-->>Web: OK + phiên\n        Web-->>User: Đăng nhập, vào app\n    end\n```\n\n#### Flow: Quên mật khẩu — đặt lại + đăng xuất mọi phiên\n\nLiên quan: FR-authentication-016..020 | Error: E-authentication-002, 009 | BR: BR-authentication-007, 008 | Related UC: uc-forgot-password.\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant Web as Web App\n    participant BE as Backend\n    participant DB as Database\n    participant Mail as Email Service\n\n    User->>Web: Bấm \"Quên mật khẩu\", nhập email, submit\n    Web->>BE: Yêu cầu đặt lại\n    BE->>DB: Email tồn tại?\n    alt Email tồn tại\n        BE->>DB: Tạo ResetToken pending, hạn 30 phút\n        BE->>Mail: Gửi email đặt lại\n    else Email không tồn tại\n        Note over BE: Không gửi gì\n    end\n    BE-->>Web: Cùng một response (chống dò tài khoản)\n    Web-->>User: Nếu email tồn tại, đã gửi link đặt lại\n\n    Note over User,Mail: Người dùng mở email, bấm link đặt lại\n    User->>Web: Bấm link đặt lại\n    Web->>BE: Xác minh token\n    alt Token hết hạn hoặc đã dùng\n        BE-->>Web: Lỗi E-authentication-009\n        Web-->>User: Link hết hạn, quên mật khẩu lại\n    else Token hợp lệ\n        BE-->>Web: OK\n        Web-->>User: Form nhập mật khẩu mới (2 lần)\n        User->>Web: Submit mật khẩu mới\n        Web->>Web: Kiểm tra chính sách mật khẩu (E-002 nếu sai)\n        Web->>BE: Gửi mật khẩu mới\n        BE->>DB: Cập nhật Credential, ResetToken used\n        BE->>DB: Thu hồi TOÀN BỘ Session mọi thiết bị (BR-007)\n        BE-->>Web: Thành công\n        Web-->>User: Đặt lại thành công, đăng nhập lại\n    end\n```\n\n#### Flow: Gỡ liên kết Google (buộc đặt mật khẩu trước nếu chưa có)\n\nLiên quan: FR-authentication-023, 024, 003 | Error: E-authentication-010 | BR: BR-authentication-004 | Related UC: uc-unlink-google.\n\n```mermaid\nsequenceDiagram\n    actor User\n    participant Web as Web App\n    participant BE as Backend\n    participant DB as Database\n\n    User->>Web: Vào màn bảo mật, bấm \"Gỡ liên kết Google\"\n    Web->>BE: Yêu cầu gỡ liên kết Google\n    BE->>DB: Tài khoản đã có mật khẩu chưa?\n    alt Chưa có mật khẩu (gốc Google)\n        BE-->>Web: Buộc tạo mật khẩu trước (E-authentication-010)\n        Web-->>User: Chuyển form tạo mật khẩu\n        User->>Web: Nhập mật khẩu đạt chính sách, submit\n        Web->>Web: Kiểm tra chính sách mật khẩu (E-002 nếu sai)\n        Web->>BE: Gửi mật khẩu mới\n        BE->>DB: Tạo Credential (FR-024)\n        BE->>DB: Gỡ LinkedProvider Google\n        BE-->>Web: Đã gỡ liên kết\n        Web-->>User: Đã gỡ Google, vẫn đăng nhập bằng email/mật khẩu\n    else Đã có mật khẩu\n        BE->>DB: Gỡ LinkedProvider Google (FR-023)\n        BE-->>Web: Đã gỡ liên kết\n        Web-->>User: Đã gỡ Google, vẫn đăng nhập bằng email/mật khẩu\n    end\n```\n\n### 10. Screens (tóm tắt — chi tiết ở ascii-wireframe/)\n\n- **login** — Form email/mật khẩu + nút Google + link \"Đăng ký\" + link \"Quên mật khẩu\"; các trạng thái lỗi E-003/E-004/E-005 + captcha.\n- **signup** — Form email + mật khẩu, đo độ mạnh mật khẩu; lỗi E-001/E-002.\n- **verify-sent** — \"Đã gửi email xác nhận tới {email}…\" + nút gửi lại (cooldown 60s / giới hạn 5/ngày).\n- **verify-result-success** — \"Xác nhận email thành công! Vui lòng đăng nhập.\" → chuyển về login.\n- **verify-result-expired** — \"Link đã hết hạn hoặc đã được sử dụng.\" + gửi lại link (E-006).\n- **forgot-password** — Form nhập email; sau khi gửi hiện thông báo trung tính chống dò tài khoản.\n- **reset-password** — Form nhập mật khẩu mới 2 lần; lỗi E-002 / E-009.\n- **reset-result-success** — \"Đặt lại mật khẩu thành công. Vui lòng đăng nhập lại.\" → chuyển về login.\n- **account-security** — Gỡ liên kết Google; buộc form tạo mật khẩu nếu chưa có (E-010); danh sách thiết bị + đăng xuất từ xa (P1).\n\nChi tiết mỗi màn ở `ascii-wireframe/{flow-slug}.md` (chạy `/wireframe-ascii`, gộp theo flow). Lưu ý: mỗi trạng thái loại trừ nhau của cùng một màn (verify-result thành công / hết hạn) tách thành screen riêng.\n\n### 11. Constraints, Dependencies & Assumptions\n\n**Constraints (ràng buộc áp đặt — có source/owner):**\n\n| Ràng buộc | Source / Owner |\n|-----------|----------------|\n| Chỉ phục vụ khu vực Đông Nam Á (VN/SG/TH/ID/MY/PH); KHÔNG phục vụ EU/EEA nên không áp GDPR | Quyết định phạm vi kinh doanh (brainstorm Mục 2, OQ-3) |\n| Chính sách quyền riêng tư phải tuân PDPA (SG/TH) + Nghị định 13/2023/NĐ-CP (VN) trước khi ra mắt | Bộ phận pháp lý / tuân thủ |\n| Chuẩn lưu trữ và bảo mật mật khẩu (thuật toán, thời hạn lưu vết) do bộ phận bảo mật/pháp lý chốt — SRS chỉ nêu \"không plaintext, không log mật khẩu\" | Bộ phận bảo mật/pháp lý |\n| Chỉ hỗ trợ responsive webapp (mobile + desktop browser); KHÔNG có app native iOS/Android | Quyết định nền tảng (brainstorm Mục 2, OQ-4) |\n| Chính sách mật khẩu cố định: 8-20 ký tự, đủ hoa/thường/ký tự đặc biệt, không chứa local-part email | CR-20260627-001 (đã chốt trong brainstorm) |\n| Tự xây (self-built), không dùng nền tảng xác thực bên thứ ba (BaaS) | Quyết định kỹ thuật cấp sản phẩm (brainstorm OQ-9) |\n\n**Dependencies (deliverable do bên khác sở hữu):**\n\n| Phụ thuộc | Owner | Blocks nếu chưa sẵn |\n|-----------|-------|---------------------|\n| Dịch vụ gửi email transactional (đã cấu hình SPF/DKIM/DMARC đúng) | Bộ phận vận hành / nhà cung cấp email | Không gửi được link xác nhận và link đặt lại mật khẩu → chặn cả luồng đăng ký email lẫn quên mật khẩu |\n| Google OAuth (đăng ký ứng dụng, hạn mức, cấu hình đúng) | Google | Không đăng nhập/đăng ký bằng Google được; email/mật khẩu vẫn là phương án dự phòng |\n| Cơ sở dữ liệu người dùng/hồ sơ (dùng chung với app) | Đội sản phẩm english-ai-demo | Không lưu được tài khoản/phiên nếu chưa sẵn sàng |\n\n> SRS chỉ nêu tên đối tác + mục đích + ràng buộc, KHÔNG đặc tả cách tích hợp kỹ thuật (thuộc tài liệu Integration Spec riêng).\n\n**Assumptions (tin là đúng — nêu hệ quả nếu sai):**\n\n| Giả định | Invalidate nếu sai |\n|----------|--------------------|\n| Người dùng có quyền truy cập hộp thư email đã đăng ký để bấm link xác nhận/đặt lại | Nếu không nhận được email → không hoàn tất đăng ký/khôi phục; phụ thuộc nặng vào resend + hỗ trợ, có thể mất người dùng mới |\n| Email là định danh duy nhất, cả email lẫn Google đều quy về cùng khóa email để liên kết | Nếu một người có nhiều email khác nhau ở email và Google → tạo 2 tài khoản riêng, không tự liên kết được |\n| Không có yêu cầu bảo vệ trẻ vị thành niên / cổng độ tuổi cho khu vực này | Nếu luật SEA yêu cầu age-gate → phải bổ sung bước xác minh độ tuổi vào luồng đăng ký |\n| Lúc đăng ký chỉ cần email + mật khẩu; tên hiển thị/avatar/ngôn ngữ bổ sung sau | Nếu cần thu thập thêm field bắt buộc lúc đăng ký → mở rộng form + validation, ảnh hưởng tỷ lệ hoàn tất |\n| Chấp nhận rủi ro tự liên kết Google mà không xác minh lại quyền sở hữu tài khoản đích | Nếu rủi ro chiếm tài khoản trở nên nghiêm trọng → phải thêm bước xác minh quyền sở hữu (nâng lên trong P1), thay đổi luồng D6 |\n\n> Quyết định kỹ thuật (nền tảng, thuật toán băm, endpoint, cấu trúc dữ liệu vật lý) KHÔNG thuộc SRS của BA — để cho dev/architect ở tài liệu Architecture riêng.\n\n\n## <a id=\"sec-erd\"></a>4. ERD\n\n> Scope: data model cho auth (tài khoản, thông tin đăng nhập, liên kết Google, token xác nhận/đặt lại, phiên, lần đăng nhập sai). Mô tả thuộc tính nghiệp vụ; loại bỏ chi tiết lưu trữ thuần kỹ thuật (thuật toán băm, kiểu cột DB).\n\n### Diagram\n\n```mermaid\nerDiagram\n    ACCOUNT ||--o| CREDENTIAL : \"có tối đa 1 thông tin đăng nhập\"\n    ACCOUNT ||--o| LINKED_PROVIDER : \"liên kết tối đa 1 Google\"\n    ACCOUNT ||--o{ VERIFICATION_TOKEN : \"có nhiều link xác nhận\"\n    ACCOUNT ||--o{ RESET_TOKEN : \"có nhiều link đặt lại\"\n    ACCOUNT ||--o{ SESSION : \"có nhiều phiên\"\n    ACCOUNT ||--o{ LOGIN_ATTEMPT : \"có nhiều lần thử đăng nhập\"\n\n    ACCOUNT {\n        string email PK \"định danh duy nhất\"\n        string status \"unverified | verified | locked\"\n        datetime created_at \"thời điểm tạo\"\n        datetime locked_until \"null nếu không bị khóa\"\n    }\n\n    CREDENTIAL {\n        string account_email FK \"thuộc tài khoản\"\n        string password_stored \"không plaintext, trống nếu gốc Google chưa đặt\"\n        datetime updated_at \"thời điểm cập nhật gần nhất\"\n    }\n\n    LINKED_PROVIDER {\n        string account_email FK \"thuộc tài khoản\"\n        string provider \"Google\"\n        string provider_user_id \"định danh Google\"\n        datetime linked_at \"thời điểm liên kết (audit)\"\n    }\n\n    VERIFICATION_TOKEN {\n        string account_email FK \"thuộc tài khoản\"\n        string state \"pending | used | expired\"\n        datetime created_at \"thời điểm tạo\"\n        datetime expires_at \"tạo cộng 24 giờ\"\n    }\n\n    RESET_TOKEN {\n        string account_email FK \"thuộc tài khoản\"\n        string state \"pending | used | expired\"\n        datetime created_at \"thời điểm tạo\"\n        datetime expires_at \"tạo cộng 30 phút\"\n    }\n\n    SESSION {\n        string account_email FK \"thuộc tài khoản\"\n        string device_info \"thiết bị đăng nhập\"\n        string state \"active | revoked\"\n        boolean remember_me \"mặc định false, 30 ngày nếu true\"\n        datetime created_at \"thời điểm tạo\"\n    }\n\n    LOGIN_ATTEMPT {\n        string account_email FK \"thuộc tài khoản\"\n        int consecutive_failures \"đếm sai liên tiếp cho ngưỡng captcha 3 / khóa 5\"\n        datetime last_attempt_at \"thời điểm lần thử gần nhất\"\n    }\n```\n\n### Entity Reference\n\n| Entity | Mục đích | Thuộc tính nghiệp vụ chính |\n|--------|----------|----------------------------|\n| ACCOUNT | Danh tính người dùng, khóa bằng email | email (PK), status (`unverified`/`verified`/`locked`), created_at, locked_until |\n| CREDENTIAL | Thông tin đăng nhập email/mật khẩu của tài khoản | password_stored (không plaintext, có thể trống nếu gốc Google), updated_at |\n| LINKED_PROVIDER | Liên kết tài khoản với Google (tự liên kết theo email) | provider (Google), provider_user_id, linked_at |\n| VERIFICATION_TOKEN | Link xác nhận email (hạn 24 giờ) | state (`pending`/`used`/`expired`), expires_at |\n| RESET_TOKEN | Link đặt lại mật khẩu (hạn 30 phút) | state (`pending`/`used`/`expired`), expires_at |\n| SESSION | Phiên đăng nhập trên 1 thiết bị | device_info, state (`active`/`revoked`), remember_me, created_at |\n| LOGIN_ATTEMPT | Theo dõi số lần đăng nhập sai liên tiếp của tài khoản | consecutive_failures, last_attempt_at |\n\n### Notes & Assumptions\n\n- `ACCOUNT.email` là định danh duy nhất — cả email/mật khẩu lẫn Google đều quy về khóa email này để tự liên kết (BR-authentication-002).\n- `CREDENTIAL.password_stored` có thể trống: tài khoản gốc qua Google chưa có mật khẩu cho tới khi người dùng tạo (bắt buộc trước khi gỡ liên kết Google — FR-authentication-024).\n- Một tài khoản liên kết tối đa 1 Google (`ACCOUNT` 1:0..1 `LINKED_PROVIDER`); gỡ liên kết thì xóa bản ghi này.\n- Tài khoản tạo qua Google được coi là `verified` ngay (BR-authentication-009) — không cần VERIFICATION_TOKEN.\n- VERIFICATION_TOKEN / RESET_TOKEN giữ lịch sử trạng thái (`used`/`expired`) để chống dùng lại và phục vụ audit; token mới vô hiệu token cũ khi gửi lại.\n- Tài khoản `unverified` quá 24 giờ bị tiến trình nền tự xóa (BR-authentication-010) — kéo theo xóa VERIFICATION_TOKEN liên quan.\n- `LOGIN_ATTEMPT.consecutive_failures` phục vụ ngưỡng captcha (3) và khóa (5); lỗi mạng KHÔNG ghi vào bộ đếm (BR-authentication-011). Điều kiện reset bộ đếm \"liên tiếp\" còn mở ([spec.md](#sec-spec) OQ-3).\n- Tài khoản không giới hạn số phiên đồng thời, phiên không tự hết hạn (FR-authentication-021); reset mật khẩu thu hồi toàn bộ phiên (BR-authentication-007).\n\n*Cross-ref: `docs/authentication/srs/authentication-spec.md` Mục 8 Data Entities, Mục 5 Business Rules.*\n\n\n## <a id=\"sec-states\"></a>5. State Diagrams\n\n> Trạng thái + transition của các entity multi-state trong feature **authentication**: Account, VerificationToken, ResetToken, Session. Mỗi entity 1 section.\n\n### State: Account\n\n**Related UC**: uc-signup-email, uc-verify-email, uc-login-email, uc-google-oauth\n**Related BR**: BR-authentication-001, 005, 009, 010, 011\n\nStates: `unverified`, `verified`, `locked`.\n\n```mermaid\nstateDiagram-v2\n    [*] --> unverified: Đăng ký email\n    [*] --> verified: Đăng ký Google (đã xác thực)\n    unverified --> verified: Bấm link xác nhận còn hạn\n    unverified --> verified: Tự liên kết Google trùng email\n    unverified --> [*]: Quá 24h chưa xác nhận (tự xóa)\n    verified --> locked: Sai mật khẩu 5 lần liên tiếp\n    locked --> verified: Sau 24h (tự mở khóa)\n\n    note right of locked\n        Tự mở khóa sau 24h (BR-005).\n        Từ 3 lần sai yêu cầu captcha (BR-006).\n        Lỗi mạng KHÔNG tính bộ đếm (BR-011).\n    end note\n```\n\n**Transitions:**\n\n| Từ | Sang | Trigger | Điều kiện |\n|---|---|---|---|\n| (none) | unverified | Đăng ký email thành công | Mật khẩu đạt chính sách + email chưa tồn tại |\n| (none) | verified | Đăng ký Google thành công | Callback OK, email Google chưa có tài khoản |\n| unverified | verified | Bấm link xác nhận | Token còn hạn + chưa dùng |\n| unverified | verified | Tự liên kết Google | Email Google trùng tài khoản `unverified` đã có (BR-003) |\n| unverified | (xóa) | Tiến trình nền | Quá 24h chưa xác nhận (BR-010) |\n| verified | locked | Đăng nhập sai | 5 lần sai liên tiếp (BR-005) |\n| locked | verified | Hết thời gian khóa | 24h trôi qua |\n\n**Invalid transitions:** verified→unverified (không \"hủy xác nhận\"); locked→unverified (khóa chỉ áp verified); unverified→locked (unverified không đăng nhập được nên không tích bộ đếm sai).\n\n### State: VerificationToken\n\n**Related UC**: uc-verify-email | **Related FR**: FR-005, 006, 007\n\nStates: `pending`, `used`, `expired`.\n\n```mermaid\nstateDiagram-v2\n    [*] --> pending: Gửi email xác nhận\n    pending --> used: Bấm link thành công\n    pending --> expired: Quá 24h\n```\n\n**Invalid transitions:** used→pending, expired→pending — token đã dùng/hết hạn không tái sử dụng (phải gửi lại tạo token mới).\n\n### State: ResetToken\n\n**Related UC**: uc-forgot-password | **Related FR**: FR-017, 018, 020\n\nStates: `pending`, `used`, `expired`.\n\n```mermaid\nstateDiagram-v2\n    [*] --> pending: Gửi email đặt lại\n    pending --> used: Đặt lại mật khẩu thành công\n    pending --> expired: Quá 30 phút\n```\n\n**Invalid transitions:** used/expired→pending — phải yêu cầu đặt lại mới.\n\n### State: Session\n\n**Related UC**: uc-login-email, uc-forgot-password | **Related BR**: BR-007 | **Related FR**: FR-019, 021, 022\n\nStates: `active`, `revoked`.\n\n```mermaid\nstateDiagram-v2\n    [*] --> active: Đăng nhập thành công\n    active --> revoked: Đăng xuất thiết bị hiện tại\n    active --> revoked: Đặt lại mật khẩu (thu hồi mọi phiên)\n```\n\n**Transitions:**\n\n| Từ | Sang | Trigger | Điều kiện |\n|---|---|---|---|\n| active | revoked | Người dùng đăng xuất | Chỉ thu hồi phiên thiết bị hiện tại (FR-022) |\n| active | revoked | Đặt lại mật khẩu | Thu hồi TOÀN BỘ phiên mọi thiết bị (BR-007) |\n\n**Invalid transitions:** revoked→active — phiên đã thu hồi không tái kích hoạt, phải đăng nhập lại. Phiên không tự hết hạn theo thời gian (trừ remember-me hết 30 ngày) và không giới hạn số phiên đồng thời (FR-021).\n\n*Cross-ref: `docs/authentication/srs/authentication-spec.md` Mục 5 Business Rules, Mục 6 Error Matrix.*\n\n\n## <a id=\"sec-functions\"></a>6. Functions\n\n### Use Cases Index\n\n#### Use cases\n\n> Bảng này là **ma trận truy vết per-feature** (UC↔FR↔Screen↔Error↔OQ) đồng thời là metadata/lifecycle — 1 nguồn duy nhất, không tách file riêng. `/gap` mới soát orphan/link-lệch cross-doc (→ `docs/_shared/traceability.md`).\n\n| # | Slug | Level | Status | Actor primary | Covers FR | Screens | Errors (E-*) | OQ ref | Priority | Updated |\n|---|------|-------|--------|---------------|-----------|---------|--------------|--------|----------|---------|\n| 1 | [uc-signup-email](#uc-uc-signup-email) | sea | draft | Học viên (đăng ký email) | FR-authentication-001, 002, 003, 004, 028, 029, 031 | signup, verify-sent | E-authentication-001, 002 | — | P0 | 2026-07-17 |\n| 2 | [uc-verify-email](#uc-uc-verify-email) | sea | draft | Người dùng chưa xác nhận | FR-authentication-005, 006, 007 | verify-sent, verify-result-success, verify-result-expired | E-authentication-006, 007 | — | P0 | 2026-07-17 |\n| 3 | [uc-login-email](#uc-uc-login-email) | sea | draft | Người dùng quay lại | FR-authentication-008, 009, 010, 011, 021, 022, 025, 026, 027 | login | E-authentication-003, 004, 005 | [spec.md](#sec-spec)#OQ-3 | P0 | 2026-07-17 |\n| 4 | [uc-google-oauth](#uc-uc-google-oauth) | sea | draft | Người dùng ưu tiên Google | FR-authentication-012, 013, 014, 015 | login | E-authentication-008 | [spec.md](#sec-spec)#OQ-1 | P0 | 2026-07-17 |\n| 5 | [uc-forgot-password](#uc-uc-forgot-password) | sea | draft | Người dùng quên mật khẩu | FR-authentication-016, 017, 018, 019, 020 | forgot-password, reset-passwo ạn 30 phút.\n4. Người dùng bấm link đặt lại còn hạn, chưa dùng.\n5. Người dùng nhập mật khẩu mới đạt chính sách, nhập lại 2 lần khớp nhau.\n6. Hệ thống cập nhật mật khẩu và đánh dấu link đặt lại đã dùng.\n7. Hệ thống thu hồi mọi phiên đăng nhập trên tất cả thiết bị.\n8. Hệ thống hiển thị \"Đặt lại mật khẩu thành công. Vui lòng đăng nhập lại.\" và chuyển về màn đăng nhập.\n\n#### Extensions\n\n**4a. Link đặt lại đã hết hạn hoặc đã được dùng:**\n- 4a1. Hệ thống từ chối và hiển thị \"Link đã hết hạn\" (E-authentication-009).\n- 4a2. Hệ thống mời người dùng yêu cầu link mới qua \"Quên mật khẩu\".\n\n**5a. Mật khẩu mới không đạt chính sách:**\n- 5a1. Hệ thống hiển thị lỗi inline (E-authentication-002); người dùng sửa lại mật khẩu.\n\n#### Related Requirements\n\n- [FR-authentication-016](#sec-spec) Yêu cầu đặt lại mật khẩu\n- [FR-authentication-017](#sec-spec) Gửi link đặt lại mật khẩu\n- [FR-authentication-018](#sec-spec) Đặt mật khẩu mới qua link\n- [FR-authentication-019](#sec-spec) Đăng xuất mọi phiên sau đặt lại\n- [FR-authentication-020](#sec-spec) Chặn link đặt lại hết hạn/đã dùng\n- BR-authentication-007 (đặt lại thu hồi toàn bộ phiên), BR-authentication-008 (thông báo trung tính chống enumeration)\n\n\n---\n\n### <a id=\"uc-uc-google-oauth\"></a>Use Case: Đăng ký/đăng nhập bằng Google (OAuth)\n\n> Scope: authentication · Level: sea-level\n\n#### Primary Actor\n\nNgười dùng ưu tiên Google (chọn đăng nhập/đăng ký một chạm bằng tài khoản Google)\n\n#### Stakeholders & Interests\n\n| Stakeholder | Interest |\n|-------------|----------|\n| Google OAuth | Xác thực danh tính Google của người dùng và trả email đã xác thực về app |\n| Bộ phận vận hành / hỗ trợ | Theo dõi cảnh báo tự liên kết Google bất thường (audit) |\n\n#### Trigger\n\nNgười dùng bấm \"Đăng nhập với Google\" ở màn đăng nhập/đăng ký.\n\n#### Preconditions\n\n- Người dùng có tài khoản Google hợp lệ.\n- Google OAuth đã được cấu hình và khả dụng.\n\n#### Guarantees\n\n- **Minimal Guarantee:** Callback thất bại không tạo tài khoản dở dang; không tạo tài khoản trùng email; không hỏi mật khẩu cũ khi tự liên kết.\n- **Success Guarantee:** Người dùng được xác định qua email Google (một luồng duy nhất cho cả đăng ký và đăng nhập), có phiên đăng nhập và vào app; email được coi là đã xác thực.\n\n#### Main Success Scenario\n\n1. Người dùng bấm \"Đăng nhập với Google\".\n2. Hệ thống chuyển người dùng tới màn hình đồng ý của Google; người dùng đồng ý.\n3. Google trả về thành công email đã xác thực của người dùng.\n4. Hệ thống xác định người dùng qua email đó (không hỏi thêm field ngoài dữ liệu Google trả).\n5. Nếu email chưa tồn tại, hệ thống tạo tài khoản mới ở trạng thái `verified`.\n6. Hệ thống tạo phiên đăng nhập và đưa người dùng vào app.\n\n#### Extensions\n\n**3a. Callback Google thất bại (mạng / lỗi Google / người dùng hủy):**\n- 3a1. Hệ thống trở về màn đăng nhập và hiển thị E-authentication-008 \"Đăng nhập Google thất bại. Vui lòng thử lại.\"\n- 3a2. Hệ thống không tạo tài khoản dở dang; người dùng thử lại Google hoặc dùng email/mật khẩu.\n\n**5a. Email Google trùng với một tài khoản đã tồn tại (tự liên kết):**\n- 5a1. Hệ thống tự liên kết Google vào tài khoản đã có, đánh dấu `verified` và đăng nhập — không tạo tài khoản trùng, không yêu cầu nhập mật khẩu cũ (FR-authentication-014).\n- 5a2. Hệ thống ghi nhật ký sự kiện tự liên kết Google phục vụ điều tra bảo mật (NFR-authentication-008).\n\n#### Related Requirements\n\n- [FR-authentication-012](#sec-spec) Đăng nhập/đăng ký bằng Google\n- [FR-authentication-013](#sec-spec) Tạo tài khoản mới từ Google\n- [FR-authentication-014](#sec-spec) Tự động liên kết Google trùng email\n- [FR-authentication-015](#sec-spec) Xử lý callback Google thất bại\n- BR-authentication-002 (email là định danh duy nhất), BR-authentication-003 (tự liên kết không hỏi mật khẩu cũ), BR-authentication-009 (tài khoản qua Google là `verified` ngay)\n\n\n---\n\n### <a id=\"uc-uc-login-email\"></a>Use Case: Đăng nhập bằng email + mật khẩu\n\n> Scope: authentication · Level: sea-level\n\n#### Primary Actor\n\nNgười dùng quay lại có tài khoản email đã xác nhận (học viên miễn phí / trả phí)\n\n#### Trigger\n\nNgười dùng nhập email + mật khẩu và bấm \"Đăng nhập\".\n\n#### Preconditions\n\n- Tài khoản tồn tại và đã ở trạng thái `verified`.\n- Tài khoản không đang bị khóa (hoặc đã hết thời gian khóa 24 giờ).\n\n#### Guarantees\n\n- **Minimal Guarantee:** Sai thông tin đăng nhập không tiết lộ email nào tồn tại; lỗi mạng không tính vào bộ đếm sai; không tạo phiên nếu chưa xác thực đủ.\n- **Success Guarantee:** Hệ thống tạo phiên đăng nhập cho thiết bị hiện tại (30 ngày nếu bật remember-me), bộ đếm sai được reset, và người dùng vào app.\n\n#### Main Success Scenario\n\n1. Người dùng nhập email + mật khẩu (tùy chọn bật remember-me) và bấm \"Đăng nhập\".\n2. Hệ thống kiểm tra tài khoản không bị khóa.\n3. Hệ thống kiểm tra email + mật khẩu khớp và tài khoản đã `verified`.\n4. Hệ thống reset bộ đếm đăng nhập sai của tài khoản.\n5. Hệ thống tạo phiên đăng nhập cho thiết bị hiện tại (giữ 30 ngày nếu bật remember-me).\n6. Hệ thống đưa người dùng vào app.\n\n#### Extensions\n\n**2a. Tài khoản đang bị khóa (≥5 lần sai):**\n- 2a1. Hệ thống hiển thị E-authentication-005 \"Tài khoản tạm khóa do nhiều lần đăng nhập sai. Vui lòng thử lại sau {X} giờ.\"\n- 2a2. Người dùng chờ tự mở khóa sau 24 giờ.\n\n**3a. Email hoặc mật khẩu không khớp:**\n- 3a1. Hệ thống hiển thị thông báo chung \"Email hoặc mật khẩu không đúng\" (E-authentication-003), không lộ email nào tồn tại, và tăng bộ đếm sai +1.\n- 3a2. Từ lần sai thứ 3 liên tiếp, hệ thống yêu cầu captcha ở các lần thử tiếp theo (FR-authentication-025).\n- 3a3. Đến lần sai thứ 5 liên tiếp, hệ thống khóa tài khoản 24 giờ (FR-authentication-026).\n\n**3b. Tài khoản đúng mật khẩu nhưng chưa `verified`:**\n- 3b1. Hệ thống chặn vào app và hiển thị E-authentication-004 \"Tài khoản chưa được xác nhận\" kèm nút gửi lại email xác nhận.\n\n**3c. Đăng nhập thất bại do lỗi mạng:**\n- 3c1. Hệ thống không tạo phiên và không tăng bộ đếm sai (FR-authentication-027); người dùng thử lại.\n\n**Luồng phụ — Đăng nhập nhiều thiết bị:**\n- Một tài khoản được phép có phiên đồng thời trên nhiều thiết bị, không giới hạn số lượng và không tự hết hạn (FR-authentication-021).\n\n**Luồng phụ — Đăng xuất thiết bị hiện tại:**\n- Người dùng bấm đăng xuất; hệ thống thu hồi phiên của thiết bị hiện tại mà không ảnh hưởng thiết bị khác, không hiện hộp thoại xác nhận (FR-authentication-022).\n\n#### Related Requirements\n\n- [FR-authentication-008](#sec-spec) Đăng nhập bằng email + mật khẩu\n- [FR-authentication-009](#sec-spec) Chặn đăng nhập tài khoản chưa xác nhận\n- [FR-authentication-010](#sec-spec) Thông báo đăng nhập sai chung\n- [FR-authentication-011](#sec-spec) Remember-me 30 ngày\n- [FR-authentication-021](#sec-spec) Đăng nhập nhiều thiết bị\n- [FR-authentication-022](#sec-spec) Đăng xuất thiết bị hiện tại\n- [FR-authentication-025](#sec-spec) Captcha sau 3 lần sai\n- [FR-authentication-026](#sec-spec) Khóa tài khoản sau 5 lần sai\n- [FR-authentication-027](#sec-spec) Không tính lỗi mạng vào bộ đếm sai\n- BR-authentication-005 (khóa 24h sau 5 lần sai), BR-authentication-006 (captcha sau 3 lần sai), BR-authentication-011 (lỗi mạng không tính bộ đếm)\n\n\n---\n\n### <a id=\"uc-uc-signup-email\"></a>Use Case: Đăng ký bằng email + mật khẩu\n\n> Scope: authentication · Level: sea-level\n\n#### Primary Actor\n\nHọc viên miễn phí / Học viên trả phí (người dùng chưa có tài khoản, chọn đăng ký bằng email)\n\n#### Trigger\n\nNgười dùng mở form đăng ký, nhập email + mật khẩu và bấm \"Đăng ký\".\n\n#### Preconditions\n\n- Người dùng chưa đăng nhập.\n- Người dùng có quyền truy cập hộp thư của email dùng để đăng ký.\n\n#### Guarantees\n\n- **Minimal Guarantee:** Không tạo tài khoản trùng email; nếu email đã tồn tại, hệ thống chặn và giữ nguyên tài khoản cũ. Mật khẩu không đạt chính sách thì không tạo tài khoản.\n- **Success Guarantee:** Tài khoản được tạo ở trạng thái `unverified`, một email chứa link xác nhận (hạn 24 giờ) được gửi tới địa chỉ đã đăng ký, và người dùng thấy màn \"đã gửi email xác nhận\".\n\n#### Main Success Scenario\n\n1. Người dùng nhập email + mật khẩu vào form đăng ký.\n2. Hệ thống kiểm tra mật khẩu đạt chính sách (8-20 ký tự, có chữ hoa, chữ thường, ký tự đặc biệt, không chứa phần đầu email).\n3. Hệ thống kiểm tra email chưa tồn tại trong hệ thống.\n4. Hệ thống tạo tài khoản mới ở trạng thái `unverified`.\n5. Hệ thống tạo link xác nhận hạn 24 giờ và gửi email xác nhận tới địa chỉ đã đăng ký.\n6. Hệ thống hiển thị màn \"Đã gửi email xác nhận tới {email}\" kèm tùy chọn gửi lại.\n\n#### Extensions\n\n**2a. Mật khẩu không đạt chính sách:**\n- 2a1. Hệ thống hiển thị lỗi inline real-time (E-authentication-002) nêu rõ yêu cầu về độ dài, loại ký tự và không chứa phần đầu email.\n- 2a2. Không tạo tài khoản; người dùng sửa lại mật khẩu và thử lại.\n\n**3a. Email đã được đăng ký:**\n- 3a1. Hệ thống chặn tạo tài khoản và hiển thị lỗi inline (E-authentication-001) gợi ý người dùng đăng nhập hoặc quên mật khẩu.\n- 3a2. Người dùng chuyển sang luồng đăng nhập hoặc quên mật khẩu.\n\n**5a. Bị bot chặn ở form đăng ký (P1):**\n- 5a1. Hệ thống yêu cầu captcha trước khi cho phép tạo tài khoản (FR-authentication-031).\n\n**Sau 4. Tài khoản `unverified` quá 24 giờ chưa xác nhận:**\n- Hệ thống tự xóa tài khoản đó (FR-authentication-028); người dùng phải đăng ký lại nếu muốn tiếp tục.\n\n#### Related Requirements\n\n- [FR-authentication-001](#sec-spec) Đăng ký bằng email + mật khẩu\n- [FR-authentication-002](#sec-spec) Chặn đăng ký email trùng\n- [FR-authentication-003](#sec-spec) Áp chính sách mật khẩu\n- [FR-authentication-004](#sec-spec) Gửi email xác nhận\n- [FR-authentication-028](#sec-spec) Tự xóa tài khoản chưa xác nhận\n- [FR-authentication-029](#sec-spec) Đo độ mạnh mật khẩu real-time (P1)\n- [FR-authentication-031](#sec-spec) Captcha chống bot khi đăng ký (P1)\n- BR-authentication-001 (gate access qua xác nhận email), BR-authentication-002 (email là định danh duy nhất), BR-authentication-010 (tự xóa `unverified` quá 24h)\n\n\n---\n\n### <a id=\"uc-uc-unlink-google\"></a>Use Case: Gỡ liên kết Google\n\n> Scope: authentication · Level: sea-level\n\n#### Primary Actor\n\nNgười dùng đã đăng nhập, muốn gỡ liên kết tài khoản Google khỏi tài khoản của mình\n\n#### Trigger\n\nNgười dùng vào màn quản lý bảo mật tài khoản và bấm \"Gỡ liên kết Google\".\n\n#### Preconditions\n\n- Người dùng đã đăng nhập.\n- Tài khoản hiện đang có liên kết Google.\n\n#### Guarantees\n\n- **Minimal Guarantee:** Không để người dùng mất lối vào tài khoản — nếu tài khoản chưa có mật khẩu thì buộc tạo mật khẩu trước khi gỡ.\n- **Success Guarantee:** Liên kết Google được gỡ khỏi tài khoản và người dùng vẫn đăng nhập được bằng email/mật khẩu.\n\n#### Main Success Scenario\n\n1. Người dùng bấm \"Gỡ liên kết Google\" ở màn quản lý bảo mật.\n2. Hệ thống kiểm tra tài khoản đã có mật khẩu.\n3. Hệ thống gỡ liên kết Google khỏi tài khoản.\n4. Hệ thống xác nhận đã gỡ; người dùng vẫn giữ khả năng đăng nhập bằng email/mật khẩu.\n\n#### Extensions\n\n**2a. Tài khoản chưa có mật khẩu (đăng ký gốc qua Google):**\n- 2a1. Hệ thống chuyển sang form buộc tạo mật khẩu và hiển thị E-authentication-010.\n- 2a2. Người dùng nhập mật khẩu đạt chính sách (8-20 ký tự, đủ hoa/thường/ký tự đặc biệt, không chứa phần đầu email).\n- 2a3. Sau khi tạo mật khẩu thành công, hệ thống mới gỡ liên kết Google (quay lại bước 3).\n\n#### Related Requirements\n\n- [FR-authentication-023](#sec-spec) Gỡ liên kết Google\n- [FR-authentication-024](#sec-spec) Buộc đặt mật khẩu trước khi gỡ Google\n- [FR-authentication-003](#sec-spec) Áp chính sách mật khẩu (khi buộc tạo mật khẩu)\n- BR-authentication-004 (phải có mật khẩu trước khi gỡ liên kết Google)\n\n\n---\n\n### <a id=\"uc-uc-verify-email\"></a>Use Case: Xác nhận email qua link\n\n> Scope: authentication · Level: sea-level\n\n#### Primary Actor\n\nNgười dùng vừa đăng ký bằng email (tài khoản đang ở trạng thái `unverified`)\n\n#### Trigger\n\nNgười dùng bấm link xác nhận trong email đã nhận, hoặc bấm \"Gửi lại email xác nhận\".\n\n#### Preconditions\n\n- Tài khoản đã được tạo và đang ở trạng thái `unverified`.\n- Người dùng đã nhận được email chứa link xác nhận.\n\n#### Guarantees\n\n- **Minimal Guarantee:** Link đã hết hạn hoặc đã dùng bị từ chối; trạng thái tài khoản không thay đổi ngoài ý muốn.\n- **Success Guarantee:** Tài khoản chuyển sang trạng thái `verified`, link xác nhận được đánh dấu đã dùng, và người dùng được mời đăng nhập.\n\n#### Main Success Scenario\n\n1. Người dùng bấm link xác nhận trong email.\n2. Hệ thống kiểm tra link còn hạn (trong 24 giờ) và chưa được dùng.\n3. Hệ thống chuyển tài khoản sang trạng thái `verified`.\n4. Hệ thống đánh dấu link xác nhận đã dùng.\n5. Hệ thống hiển thị \"Xác nhận email thành công! Vui lòng đăng nhập.\" và chuyển về màn đăng nhập.\n\n#### Extensions\n\n**2a. Link đã hết hạn hoặc đã được dùng:**\n- 2a1. Hệ thống từ chối và hiển thị trang kết quả \"Link đã hết hạn hoặc đã được sử dụng\" (E-authentication-006).\n- 2a2. Hệ thống mời người dùng gửi lại link xác nhận.\n\n**Luồng phụ — Người dùng yêu cầu gửi lại email xác nhận:**\n- b1. Người dùng bấm \"Gửi lại email xác nhận\".\n- b2. Nếu còn trong cooldown 60 giây hoặc đã đủ 5 lần/ngày, hệ thống chặn và thông báo thời gian chờ / đã đạt giới hạn ngày (E-authentication-007).\n- b3. Nếu được phép, hệ thống tạo link mới hạn 24 giờ, gửi lại email và reset cooldown 60 giây.\n\n**Race — hai thiết bị cùng bấm một link:**\n- Thiết bị đầu tiên xác nhận thành công; thiết bị sau nhận E-authentication-006 \"Link đã được sử dụng\".\n\n#### Related Requirements\n\n- [FR-authentication-005](#sec-spec) Xác nhận email qua link\n- [FR-authentication-006](#sec-spec) Chặn link xác nhận hết hạn/đã dùng\n- [FR-authentication-007](#sec-spec) Gửi lại email xác nhận\n- BR-authentication-001 (phải xác nhận email trước khi truy cập nội dung học)\n\n\n## 7. Screens (catalog)\n\n| # | Slug | Status | Thuộc flow | Used by | Mô tả |\n|---|---|---|---|---|---|\n| 1 | login | draft | login-email | FR-008, FR-010, FR-011, FR-012, FR-025, FR-026, FR-027 | Màn hình đăng nhập bằng email/password kèm remember-me, nút đăng nhập Google, và lối vào đăng ký / quên mật khẩu. Người học thấy khi bấm \"Đăng nhập\" hoặc khi chưa có phiên hợp lệ; hiển thị captcha từ lần sai thứ 3 và thông báo khóa từ lần sai thứ 5. |\n| 2 | signup | draft | signup-verify | FR-001, FR-002, FR-003, FR-029, FR-031 | Form đăng ký tài khoản mới bằng email + mật khẩu, có thanh đo độ mạnh mật khẩu real-time và captcha chống bot. Người học thấy khi bấm \"Đăng ký\" từ màn hình đăng nhập. |\n| 3 | verify-sent | draft | signup-verify | FR-004, FR-007 | Thông báo đã gửi email xác nhận (hạn 24 giờ) tới địa chỉ vừa đăng ký, kèm nút gửi lại có cooldown 60 giây / tối đa 5 lần một ngày. Người học thấy ngay sau khi đăng ký email thành công. |\n| 4 | verify-result-success | draft | signup-verify | FR-005 | Trang kết quả khi người học bấm link xác nhận còn hạn — thông báo xác nhận thành công và mời đăng nhập. Người học thấy sau khi click link verify hợp lệ. |\n| 5 | verify-result-expired | draft | signup-verify | FR-006, FR-007 | Trang kết quả khi link xác nhận đã hết hạn 24 giờ hoặc đã được dùng (E-006), kèm nút gửi lại link. Người học thấy khi click link verify không còn hợp lệ. |\n| 6 | forgot-password | draft | forgot-password | FR-016, FR-017 | Form nhập email để yêu cầu link đặt lại mật khẩu, kèm thông báo trung tính chống dò tài khoản (báo giống nhau dù email tồn tại hay không). Người học thấy khi bấm \"Quên mật khẩu\" từ màn đăng nhập. |\n| 7 | reset-password | draft | forgot-password | FR-003, FR-018, FR-020, FR-029 | Form nhập mật khẩu mới (2 lần khớp) đạt chính sách 8-20 ký tự sau khi click link đặt lại còn hạn 30 phút; có thanh đo độ mạnh. Người học thấy khi mở reset link hợp lệ từ email. |\n| 8 | reset-result-success | draft | forgot-password | FR-019 | Trang xác nhận đặt lại mật khẩu thành công, báo mọi phiên trên các thiết bị đã bị thu hồi và mời đăng nhập lại. Người học thấy sau khi submit mật khẩu mới hợp lệ. |\n| 9 | account-security | draft | unlink-google | FR-023, FR-024, FR-030 | Trang bảo mật cho người học đã đăng nhập để gỡ liên kết Google (buộc tạo mật khẩu trước nếu tài khoản chưa có, E-010) và xem danh sách thiết bị đang đăng nhập với đăng xuất từ xa (P1). Người học thấy khi vào phần cài đặt bảo mật. |\n\n> Flow `google-oauth` dùng chung screen `login` (không có screen riêng) — xem `login-email.md`; nhánh nghiệp vụ OAuth mô tả trong bảng element của screen login.\n\n\n## <a id=\"sec-wireframes\"></a>8. Wireframes\n\n#### Flow: forgot-password\n\n**HTML wireframe (render):**\n\n<div class=\"wf-embed\"><style>\n.wf-embed .wf-page { max-width: 1400px; margin: 0 auto; }\n.wf-embed .wf-breadcrumb { max-width: 1400px; margin: 0 auto 16px; }\n.wf-embed .wf-breadcrumb a { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #000; text-decoration: none; border: 1px solid #000; border-radius: 4px; padding: 6px 12px; background: #fff; }\n.wf-embed .wf-breadcrumb a:hover { background: #f0f0f0; }\n.wf-embed html.in-iframe .wf-breadcrumb { display: none; }\n.wf-embed .wf-header { margin-bottom: 28px; border-bottom: 2px solid #000; padding-bottom: 14px; background: #fff; padding: 16px 20px; }\n.wf-embed .wf-feature-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; }\n.wf-embed .wf-flow-title { font-size: 22px; font-weight: 700; margin-top: 4px; }\n.wf-embed .wf-flow-meta { font-size: 12px; color: #888; margin-top: 6px; }\n.wf-embed .wf-flow-desc { font-size: 13px; color: #444; margin-top: 8px; line-height: 1.5; }\n.wf-embed .wf-rows { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px 16px; }\n.wf-embed .wf-screen { flex: 0 0 auto; }\n.wf-embed .wf-page[data-device=\"desktop\"] .wf-screen { width: 1024px; max-width: 100%; }\n.wf-embed .wf-device-tag { display: inline-block; font-size: 10px; color: #555; border: 1px solid
