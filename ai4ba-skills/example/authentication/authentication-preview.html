badge\">3</div>\n<div class=\"wf-device-tag\">desktop · 1024px</div>\n<div class=\"wf-screen-frame\">\n<div class=\"wf-screen-bar\"><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><span class=\"wf-bar-title\">Đặt lại thành công</span></div>\n<div class=\"wf-screen-content\">\n<div class=\"wf-app-brand\">english-ai-demo</div>\n<div class=\"wf-form\">\n<div class=\"result-icon\">&#10003;</div>\n<div class=\"wf-screen-title\">Đặt lại mật khẩu thành công</div>\n<div class=\"result-text\">[1] Mọi phiên đăng nhập trên các thiết bị đã được đăng xuất vì lý do an toàn. Vui lòng đăng nhập lại bằng mật khẩu mới. (FR-019, BR-007)</div>\n<button class=\"btn-primary\">Đến trang đăng nhập [2]</button>\n</div>\n</div>\n</div>\n<div class=\"wf-screen-label\">reset-result-success</div>\n</div>\n</div>\n<div class=\"wf-desc-section\">\n<div class=\"wf-desc-title\">Mô tả màn hình</div>\n<table class=\"wf-desc-table\">\n<thead><tr><th>#</th><th>Items</th><th>Control type</th><th>Data type</th><th>Description</th></tr></thead>\n<tbody>\n<tr class=\"wf-desc-screen-header\"><td colspan=\"5\">Screen 1: forgot-password — Quên mật khẩu</td></tr>\n<tr><td>1</td><td>Email</td><td>Textbox</td><td>Text (email)</td><td>• <strong>Mục đích</strong>: nhận email để phát hành link đặt lại (FR-017).<br>• <strong>Validation</strong>: bắt buộc; kiểm định dạng; auto-focus.<br>• <strong>Security</strong>: KHÔNG báo email tồn tại hay không tại field này (anti-enumeration, NFR-007).</td></tr>\n<tr><td>2</td><td>Gửi link đặt lại</td><td>Button (Primary)</td><td>Click/Submit</td><td>• <strong>Mục đích</strong>: yêu cầu gửi email đặt lại.<br>• <strong>Hệ quả</strong>: sau submit LUÔN hiện thông báo trung tính \"Nếu email tồn tại trong hệ thống, đã gửi link đặt lại.\" bất kể email tồn tại hay không (FR-016, BR-008).<br>• <strong>Backend (ẩn)</strong>: email khớp → gửi link đặt lại hạn 30 phút (FR-017); không khớp → không gửi nhưng thông báo giống hệt.</td></tr>\n<tr><td>3</td><td>Thông báo trung tính</td><td>Label</td><td>ReadOnly</td><td>• <strong>Nội dung</strong>: \"Nếu email tồn tại trong hệ thống, đã gửi link đặt lại.\"<br>• <strong>States</strong>: ẩn (trước submit) / hiện (sau submit).</td></tr>\n<tr><td>4</td><td>Đăng nhập</td><td>Link</td><td>Navigate</td><td>• <strong>Navigate</strong> sang màn login.</td></tr>\n<tr class=\"wf-desc-screen-header\"><td colspan=\"5\">Screen 2: reset-password — Đặt mật khẩu mới</td></tr>\n<tr><td>1</td><td>Mật khẩu mới</td><td>Textbox (password)</td><td>Text</td><td>• <strong>Mục đích</strong>: nhận mật khẩu mới (FR-018).<br>• <strong>Validation (FR-003)</strong>: 8-20 ký tự, đủ hoa/thường/ký tự đặc biệt, không chứa phần đầu email.<br>• <strong>Error</strong>: E-authentication-002 inline.<br>• <strong>States</strong>: masked + Hiện/Ẩn; validate real-time.</td></tr>\n<tr><td>2</td><td>Độ mạnh mật khẩu</td><td>Meter</td><td>ReadOnly</td><td>• <strong>Mục đích</strong>: gợi ý mật khẩu mạnh hơn (FR-029, P1); cập nhật real-time.</td></tr>\n<tr><td>3</td><td>Nhập lại mật khẩu mới</td><td>Textbox (password)</td><td>Text</td><td>• <strong>Mục đích</strong>: xác nhận trùng khớp (FR-018 — nhập 2 lần khớp).<br>• <strong>Validation</strong>: bắt buộc khớp field trên; báo lỗi inline nếu không khớp.</td></tr>\n<tr><td>4</td><td>Đặt lại mật khẩu</td><td>Button (Primary)</td><td>Click/Submit</td><td>• <strong>Mục đích</strong>: cập nhật mật khẩu + đánh dấu link đã dùng (FR-018).<br>• <strong>Success</strong>: cập nhật + thu hồi mọi phiên trên mọi thiết bị (FR-019, BR-007) → sang reset-result-success.<br>• <strong>Error link hết hạn/đã dùng</strong>: E-authentication-009 \"Link đã hết hạn. [Quên mật khẩu] lại để nhận link mới.\" (FR-020).<br>• <strong>Precondition</strong>: chỉ mở màn này khi link còn hạn 30 phút + chưa dùng.</td></tr>\n<tr class=\"wf-desc-screen-header\"><td colspan=\"5\">Screen 3: reset-result-success — Đặt lại thành công</td></tr>\n<tr><td>1</td><td>Thông báo thành công</td><td>Label</td><td>ReadOnly</td><td>• <strong>Mục đích</strong>: xác nhận mật khẩu đã đổi + cảnh báo mọi phiên bị thu hồi (FR-019, BR-007).<br>• <strong>Nội dung</strong>: \"Đặt lại mật khẩu thành công. Mọi phiên trên các thiết bị đã bị đăng xuất. Vui lòng đăng nhập lại.\"<br>• <strong>Lý do</strong>: chặn kẻ có phiên cũ tiếp tục truy cập sau khi chủ tài khoản đổi mật khẩu.</td></tr>\n<tr><td>2</td><td>Đến trang đăng nhập</td><td>Button (Primary)</td><td>Click/Navigate</td><td>• <strong>Navigate</strong> sang màn login.</td></tr>\n</tbody>\n</table>\n</div>\n<div class=\"wf-footer\"><span>authentication / forgot-password</span><span>Tạo bởi /wireframe-html · 2026-07-20</span></div>\n</div>\n<script>if (window.self !== window.top) document.documentElement.classList.add('in-iframe');<\/script>\n</div>\n\n\n**ASCII wireframe + mô tả:**\n\n> Màn hình: forgot-password → reset-password → reset-result-success. Flow tổng xem `../srs/authentication-userflow.md`. Device: desktop 1024, form căn giữa box hẹp ~400px.\n\n---\n\n### Screen: forgot-password — Quên mật khẩu\n\n#### Wireframe (ASCII)\n\n```text\n+----------------------------------------------------------------------+\n|  english-ai-demo                                                     |\n|                  +----------------------------------+                |\n|                  |           Quen mat khau           |               |\n|                  |  Nhap email tai khoan, chung toi  |               |\n|                  |  se gui link dat lai mat khau.    |               |\n|                  |  Email                            |               |\n|                  |  +-----------------------------+  |               |\n|                  |  | ban@email.com               |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  |      Gui link dat lai       |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  Nho mat khau roi?  Dang nhap     |               |\n|                  +----------------------------------+                |\n+----------------------------------------------------------------------+\n```\n\n> Sau khi bấm \"Gửi link đặt lại\", box đổi sang trạng thái thông báo trung tính (cùng thông báo dù email tồn tại hay không — element #3).\n\n#### Screen description\n\n| # | Items | Control type | Data type | Description |\n|---|-------|--------------|-----------|-------------|\n| 1 | Email | Textbox | Text (email) | • **Mục đích**: nhận email để phát hành link đặt lại (FR-017).<br>• **Validation**: bắt buộc; kiểm định dạng; auto-focus.<br>• **Security**: KHÔNG báo email tồn tại hay không tại field này (anti-enumeration, NFR-007). |\n| 2 | Gửi link đặt lại | Button (Primary) | Click/Submit | • **Mục đích**: yêu cầu gửi email đặt lại.<br>• **Navigation/hệ quả**: sau submit LUÔN hiện thông báo trung tính \"Nếu email tồn tại trong hệ thống, đã gửi link đặt lại.\" bất kể email tồn tại hay không (FR-016, BR-008).<br>• **Backend (ẩn)**: nếu email khớp → gửi link đặt lại hạn 30 phút (FR-017); không khớp → không gửi nhưng thông báo giống hệt. |\n| 3 | Thông báo trung tính | Label | ReadOnly | • **Nội dung**: \"Nếu email tồn tại trong hệ thống, đã gửi link đặt lại.\"<br>• **States**: ẩn (trước submit) / hiện (sau submit). |\n| 4 | Đăng nhập | Link | Navigate | • **Navigation**: sang màn `login`. |\n\n---\n\n### Screen: reset-password — Đặt mật khẩu mới\n\n#### Wireframe (ASCII)\n\n```text\n+----------------------------------------------------------------------+\n|  english-ai-demo                                                     |\n|                  +----------------------------------+                |\n|                  |         Dat mat khau moi          |               |\n|                  |  Mat khau moi                     |               |\n|                  |  +-----------------------+-----+  |               |\n|                  |  | ........              | Hien|  |               |\n|                  |  +-----------------------+-----+  |               |\n|                  |  Do manh: [======----] Manh       |               |\n|                  |  Nhap lai mat khau moi            |               |\n|                  |  +-----------------------+-----+  |               |\n|                  |  | ........              | Hien|  |               |\n|                  |  +-----------------------+-----+  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  |      Dat lai mat khau       |  |               |\n|                  |  +-----------------------------+  |               |\n|                  +----------------------------------+                |\n+----------------------------------------------------------------------+\n```\n\n#### Screen description\n\n| # | Items | Control type | Data type | Description |\n|---|-------|--------------|-----------|-------------|\n| 1 | Mật khẩu mới | Textbox (password) | Text | • **Mục đích**: nhận mật khẩu mới (FR-018).<br>• **Validation (FR-003)**: 8-20 ký tự, đủ hoa/thường/ký tự đặc biệt, không chứa phần đầu email.<br>• **Error**: `E-authentication-002` inline.<br>• **States**: masked + Hiện/Ẩn; validate real-time. |\n| 2 | Độ mạnh mật khẩu | Meter | ReadOnly | • **Mục đích**: gợi ý mật khẩu mạnh hơn (FR-029, P1); cập nhật real-time. |\n| 3 | Nhập lại mật khẩu mới | Textbox (password) | Text | • **Mục đích**: xác nhận trùng khớp (FR-018 — nhập 2 lần khớp).<br>• **Validation**: bắt buộc khớp field trên; báo lỗi inline nếu không khớp. |\n| 4 | Đặt lại mật khẩu | Button (Primary) | Click/Submit | • **Mục đích**: cập nhật mật khẩu + đánh dấu link đã dùng (FR-018).<br>• **Navigation success**: cập nhật + thu hồi mọi phiên trên mọi thiết bị (FR-019, BR-007) → sang `reset-result-success`.<br>• **Error — link hết hạn/đã dùng**: `E-authentication-009` \"Link đã hết hạn. [Quên mật khẩu] lại để nhận link mới.\" (FR-020).<br>• **Precondition**: chỉ mở màn này khi link còn hạn 30 phút + chưa dùng. |\n\n---\n\n### Screen: reset-result-success — Đặt lại thành công\n\n#### Wireframe (ASCII)\n\n```text\n+----------------------------------------------------------------------+\n|  english-ai-demo                                                     |\n|                  +----------------------------------+                |\n|                  |              [ v ]                |               |\n|                  |    Dat lai mat khau thanh cong    |               |\n|                  |  Moi phien dang nhap tren cac     |               |\n|                  |  thiet bi da duoc dang xuat vi ly |               |\n|                  |  do an toan. Vui long dang nhap   |               |\n|                  |  lai bang mat khau moi.           |               |\n|                  |  +-----------------------------+  |               |\n|                  |  |      Den trang dang nhap    |  |               |\n|                  |  +-----------------------------+  |               |\n|                  +----------------------------------+                |\n+----------------------------------------------------------------------+\n```\n\n#### Screen description\n\n| # | Items | Control type | Data type | Description |\n|---|-------|--------------|-----------|-------------|\n| 1 | Thông báo thành công | Label | ReadOnly | • **Mục đích**: xác nhận mật khẩu đã đổi + cảnh báo mọi phiên bị thu hồi (FR-019, BR-007).<br>• **Nội dung**: \"Đặt lại mật khẩu thành công. Mọi phiên trên các thiết bị đã bị đăng xuất. Vui lòng đăng nhập lại.\"<br>• **Lý do**: chặn kẻ có phiên cũ tiếp tục truy cập sau khi chủ tài khoản đổi mật khẩu. |\n| 2 | Đến trang đăng nhập | Button (Primary) | Click/Navigate | • **Navigation**: sang màn `login`. |\n\n---\n\n#### Flow: google-oauth\n\n**HTML wireframe (render):**\n\n<div class=\"wf-embed\"><style>\n.wf-embed .wf-pa an class=\"eye\">Hiện</span></div></div>\n<div class=\"links-row\"><label class=\"checkbox\"><input type=\"checkbox\"> Ghi nhớ đăng nhập</label><a class=\"wf-link\">Quên mật khẩu?</a></div>\n<button class=\"btn-primary\">Đăng nhập</button>\n<div class=\"divider\">hoặc</div>\n<button class=\"btn-secondary\"><span class=\"g-icon\">G</span> Đăng nhập với Google [điểm vào flow này]</button>\n<div class=\"links-center\">Chưa có tài khoản? <a class=\"wf-link\">Đăng ký</a></div>\n</div>\n</div>\n</div>\n<div class=\"wf-screen-label\">login<span class=\"wf-shared-badge\">chung login-email</span></div>\n</div>\n<div class=\"wf-screen\" id=\"s2\" style=\"width:520px;\">\n<div class=\"wf-step-badge\">2</div>\n<div class=\"wf-device-tag\">Nhánh nghiệp vụ OAuth (không phải màn UI)</div>\n<div class=\"branch-note\">\n<h3>Sau khi bấm \"Đăng nhập với Google\"</h3>\nHệ thống khởi tạo OAuth 2.0, chuyển sang trang consent của Google. Khi Google callback về, kết quả rẽ theo bảng dưới. Không có màn hình riêng của app — người dùng hoặc vào app, hoặc về màn login kèm banner lỗi.\n<table>\n<thead><tr><th>Nhánh</th><th>Kết quả nghiệp vụ</th><th>Nguồn</th></tr></thead>\n<tbody>\n<tr><td>Callback thành công, email mới</td><td>Tạo tài khoản mới trạng thái verified → vào app</td><td>FR-013, BR-009</td></tr>\n<tr><td>Callback thành công, email trùng tài khoản có sẵn</td><td>Tự liên kết Google vào tài khoản đã có (không tạo trùng, không hỏi mật khẩu cũ) → vào app</td><td>FR-014, BR-003</td></tr>\n<tr><td>Callback thất bại (mạng/Google/người dùng hủy)</td><td>Về màn login, banner \"Đăng nhập Google thất bại. Vui lòng thử lại.\" — không tạo tài khoản dở dang</td><td>FR-015, E-008</td></tr>\n<tr><td>Edge: đóng tab consent giữa chừng</td><td>Coi như thất bại (E-008)</td><td>FR-015</td></tr>\n<tr><td>Edge: email Google khác hoàn toàn email đã có</td><td>Tạo tài khoản riêng, không tự liên kết</td><td>Assumption Mục 11</td></tr>\n</tbody>\n</table>\n<p style=\"margin-top:8px;font-size:10px;color:#888;font-style:italic;\">OQ-1: auto-link không re-verify quyền sở hữu tài khoản đích — rủi ro chiếm tài khoản (userflow OQ-1 / spec Mục 12). Sự kiện tự-liên-kết được ghi vết phục vụ điều tra (NFR-008).</p>\n</div>\n<div class=\"wf-screen-label\">nhánh OAuth (tham chiếu element #7 màn login)</div>\n</div>\n</div>\n<div class=\"wf-desc-section\">\n<div class=\"wf-desc-title\">Nhánh nghiệp vụ (tham chiếu element \"Đăng nhập với Google\" của màn login)</div>\n<table class=\"wf-desc-table\">\n<thead><tr><th>Nhánh</th><th>Kết quả nghiệp vụ</th><th>Nguồn</th></tr></thead>\n<tbody>\n<tr><td>Callback Google thành công, email mới</td><td>Tạo tài khoản mới ở trạng thái verified → vào app</td><td>FR-authentication-013, BR-authentication-009</td></tr>\n<tr><td>Callback Google thành công, email trùng tài khoản có sẵn</td><td>Tự liên kết Google vào tài khoản đã có (không tạo trùng, không hỏi mật khẩu cũ) → vào app</td><td>FR-authentication-014, BR-authentication-003</td></tr>\n<tr><td>Callback Google thất bại (mạng/Google/người dùng hủy)</td><td>Về màn login, banner \"Đăng nhập Google thất bại. Vui lòng thử lại.\" — không tạo tài khoản dở dang</td><td>FR-authentication-015, E-authentication-008</td></tr>\n<tr><td>Edge: đóng tab consent giữa chừng</td><td>Coi như thất bại (E-008)</td><td>FR-015</td></tr>\n<tr><td>Edge: email Google khác hoàn toàn email đã có</td><td>Tạo tài khoản riêng, không tự liên kết</td><td>Assumption Mục 11</td></tr>\n</tbody>\n</table>\n</div>\n<div class=\"wf-footer\"><span>authentication / google-oauth</span><span>Tạo bởi /wireframe-html · 2026-07-20</span></div>\n</div>\n<script>if (window.self !== window.top) document.documentElement.classList.add('in-iframe');<\/script>\n</div>\n\n\n**ASCII wireframe + mô tả:**\n\n> Flow này KHÔNG có screen riêng — dùng chung screen `login` (nút \"Đăng nhập với Google\") ở `login-email.md`. File này ghi nhận nhánh nghiệp vụ OAuth để đối chiếu; xem element #7 của screen login cho chi tiết render + trạng thái.\n\n---\n\n### Nhánh nghiệp vụ (tham chiếu screen login)\n\n| Nhánh | Nguồn | Kết quả nghiệp vụ |\n|-------|-------|-------------------|\n| Callback Google thành công, email mới | FR-authentication-013, BR-authentication-009 | Tạo tài khoản mới ở trạng thái `verified` → vào app |\n| Callback Google thành công, email trùng tài khoản có sẵn | FR-authentication-014, BR-authentication-003 | Tự liên kết Google vào tài khoản đã có (không tạo trùng, không hỏi mật khẩu cũ) → vào app |\n| Callback Google thất bại (mạng/Google/người dùng hủy) | FR-authentication-015, E-authentication-008 | Về màn login, banner \"Đăng nhập Google thất bại. Vui lòng thử lại.\" — không tạo tài khoản dở dang |\n| Edge: đóng tab consent giữa chừng | FR-015 | Coi như thất bại (E-008) |\n| Edge: email Google khác hoàn toàn email đã có | Assumption Mục 11 | Tạo tài khoản riêng, không tự liên kết |\n\n> OQ liên quan: auto-link không re-verify quyền sở hữu tài khoản đích — rủi ro chiếm tài khoản (userflow OQ-1 / spec Mục 12). Ghi vết sự kiện tự-liên-kết Google phục vụ điều tra (NFR-authentication-008).\n\n---\n\n#### Flow: login-email\n\n**HTML wireframe (render):**\n\n<div class=\"wf-embed\"><style>\n.wf-embed .wf-page { max-width: 1400px; margin: 0 auto; }\n.wf-embed .wf-breadcrumb { max-width: 1400px; margin: 0 auto 16px; }\n.wf-embed .wf-breadcrumb a { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #000; text-decoration: none; border: 1px solid #000; border-radius: 4px; padding: 6px 12px; background: #fff; }\n.wf-embed .wf-breadcrumb a:hover { background: #f0f0f0; }\n.wf-embed html.in-iframe .wf-breadcrumb { display: none; }\n.wf-embed .wf-header { margin-bottom: 28px; border-bottom: 2px solid #000; padding-bottom: 14px; background: #fff; padding: 16px 20px; }\n.wf-embed .wf-feature-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; }\n.wf-embed .wf-flow-title { font-size: 22px; font-weight: 700; margin-top: 4px; }\n.wf-embed .wf-flow-meta { font-size: e\">1</div>\n<div class=\"wf-device-tag\">desktop · 1024px</div>\n<div class=\"wf-screen-frame\">\n<div class=\"wf-screen-bar\">\n<div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div>\n<span class=\"wf-bar-title\">Đăng nhập tài khoản</span>\n</div>\n<div class=\"wf-screen-content\">\n<div class=\"wf-app-brand\">english-ai-demo</div>\n<div class=\"wf-form\">\n<div class=\"wf-screen-title\">Đăng nhập tài khoản</div>\n<div class=\"field\">\n<label>Email [1]</label>\n<input type=\"email\" placeholder=\"ban@email.com\">\n<span class=\"state-hint\">Bắt buộc · định danh account (BR-002) · không kiểm tồn tại (NFR-007)</span>\n</div>\n<div class=\"field\">\n<label>Mật khẩu [2]</label>\n<div class=\"input-pw\"><input type=\"password\" value=\"\"><span class=\"eye\">Hiện</span></div>\n<span class=\"state-hint\">Login KHÔNG validate policy — chỉ so khớp (FR-003)</span>\n</div>\n<div class=\"links-row\">\n<label class=\"checkbox\"><input type=\"checkbox\"> Ghi nhớ đăng nhập [3]</label>\n<a class=\"wf-link\">Quên mật khẩu? [4]</a>\n</div>\n<div class=\"captcha-box\">[5] Captcha — hiện sau ≥3 lần đăng nhập sai (FR-025, BR-006)</div>\n<button class=\"btn-primary\">Đăng nhập [6]</button>\n<div class=\"divider\">hoặc</div>\n<button class=\"btn-secondary\"><span class=\"g-icon\">G</span> Đăng nhập với Google [7]</button>\n<div class=\"links-center\">Chưa có tài khoản? <a class=\"wf-link\">Đăng ký [8]</a></div>\n</div>\n</div>\n</div>\n<div class=\"wf-screen-label\">login<span class=\"wf-shared-badge\">chung google-oauth</span></div>\n</div>\n</div>\n<div class=\"wf-desc-section\">\n<div class=\"wf-desc-title\">Mô tả màn hình</div>\n<table class=\"wf-desc-table\">\n<thead><tr><th>#</th><th>Items</th><th>Control type</th><th>Data type</th><th>Description</th></tr></thead>\n<tbody>\n<tr class=\"wf-desc-screen-header\"><td colspan=\"5\">Screen 1: login — Đăng nhập tài khoản</td></tr>\n<tr>\n<td>1</td><td>Email</td><td>Textbox</td><td>Text (email)</td>\n<td>• <strong>Mục đích</strong>: định danh tài khoản đăng nhập — email là định danh duy nhất (BR-authentication-002).<br>• <strong>Validation</strong>: bắt buộc; kiểm định dạng email. KHÔNG kiểm sự tồn tại của email (chống enumeration, NFR-authentication-007).<br>• <strong>States</strong>: default rỗng + auto-focus; error viền đỏ nếu định dạng sai.<br>• <strong>Placeholder</strong> \"ban@email.com\"; không autocomplete lộ email đã đăng ký.</td>\n</tr>\n<tr>\n<td>2</td><td>Mật khẩu</td><td>Textbox (password)</td><td>Text</td>\n<td>• <strong>Mục đích</strong>: xác thực chủ tài khoản.<br>• <strong>Validation</strong>: bắt buộc. Login KHÔNG validate policy 8-20/hoa/thường/đặc biệt — chỉ so khớp mật khẩu đã lưu; policy chỉ áp ở signup/reset (FR-003).<br>• <strong>States</strong>: masked mặc định, nút Hiện/Ẩn toggle.<br>• <strong>Security</strong>: không lưu plaintext, không ghi log (NFR-authentication-003).</td>\n</tr>\n<tr>\n<td>3</td><td>Ghi nhớ đăng nhập</td><td>Checkbox</td><td>Boolean</td>\n<td>• <strong>Mục đích</strong>: giữ phiên lâu cho người dùng đa thiết bị (FR-authentication-011, NFR-006).<br>• <strong>Default OFF</strong>.<br>• <strong>Hệ quả</strong>: tick → phiên giữ 30 ngày trên thiết bị đó; không tick → phiên phiên-làm-việc thường.</td>\n</tr>\n<tr>\n<td>4</td><td>Quên mật khẩu?</td><td>Link</td><td>Navigate</td>\n<td>• <strong>Navigate</strong> sang màn forgot-password. Luôn hiển thị.</td>\n</tr>\n<tr>\n<td>5</td><td>Captcha</td><td>Banner/Widget</td><td>ReadOnly (challenge)</td>\n<td>• <strong>Mục đích</strong>: chống dò mật khẩu bằng thử lặp (NFR-authentication-005).<br>• <strong>Display rule</strong>: chỉ hiện khi tài khoản có ≥3 lần đăng nhập sai liên tiếp (FR-025, BR-authentication-006).<br>• <strong>Validation khi hiện</strong>: bắt buộc pass captcha mới cho submit.<br>• <strong>States</strong>: ẩn (fail 0-2) / hiện (fail ≥3).</td>\n</tr>\n<tr>\n<td>6</td><td>Đăng nhập</td><td>Button (Primary)</td><td>Click/Submit</td>\n<td>• <strong>Mục đích</strong>: gửi thông tin, tạo phiên nếu hợp lệ (FR-authentication-008).<br>• <strong>Enable</strong>: disabled khi email/mật khẩu rỗng (và khi captcha hiện mà chưa pass).<br>• <strong>Submitting</strong>: \"Đang đăng nhập...\", spinner, disabled.<br>• <strong>Success</strong>: verified + không khóa + khớp → vào app.<br>• <strong>Error sai thông tin</strong>: E-authentication-003 \"Email hoặc mật khẩu không đúng\" (chung, không lộ email tồn tại, FR-010); bộ đếm sai +1.<br>• <strong>Error chưa xác nhận</strong>: E-authentication-004 \"Tài khoản chưa được xác nhận.\" + nút [Gửi lại email xác nhận] (FR-009).<br>• <strong>Error bị khóa</strong>: E-authentication-005 \"Tài khoản tạm khóa... thử lại sau {X} giờ.\" khi ≥5 lần sai → khóa 24h tự mở (FR-026, BR-005).<br>• <strong>Edge lỗi mạng</strong>: không tăng bộ đếm sai (FR-027, BR-011).<br>• <strong>Performance</strong>: kết quả trong 3 giây ở 95% (NFR-001).</td>\n</tr>\n<tr>\n<td>7</td><td>Đăng nhập với Google</td><td>Button (Secondary)</td><td>Click</td>\n<td>• <strong>Mục đích</strong>: đăng nhập/đăng ký một chạm qua Google, 1 luồng duy nhất (FR-authentication-012).<br>• <strong>Success email mới</strong>: tạo tài khoản mới trạng thái verified (FR-013, BR-009) → vào app.<br>• <strong>Success email trùng</strong>: tự liên kết Google vào tài khoản đã có, không tạo trùng, không hỏi mật khẩu cũ (FR-014, BR-003) → vào app.<br>• <strong>Error</strong>: E-authentication-008 \"Đăng nhập Google thất bại. Vui lòng thử lại.\" khi callback lỗi/hủy — không tạo tài khoản dở dang (FR-015).<br>• <strong>Edge</strong>: đóng tab consent = thất bại; email Google khác hoàn toàn → tạo tài khoản riêng.</td>\n</tr>\n<tr>\n<td>8</td><td>Đăng ký</td><td>Link</td><td>Navigate</td>\n<td>• <strong>Navigate</strong> sang màn signup (FR-001).</td>\n</tr>\n</tbody>\n</table>\n</div>\n<div class=\"wf-footer\"><span>authentication / login-email</span><span>Tạo bởi /wireframe-html · 2026-07-17</span></div>\n</div>\n<script>if (window.self !== window.top) document.documentElement.classList.add('in-iframe');<\/script>\n</div>\n\n\n**ASCII wireframe + mô tả:**\n\n> Màn hình thuộc flow này: login. Flow tổng xem `../srs/authentication-userflow.md` Mục 1. Screen `login` cũng được dùng chung bởi flow `google-oauth` (nhánh nghiệp vụ OAuth mô tả ở element \"Đăng nhập với Google\"). Device: desktop 1024, form căn giữa trong box hẹp ~400px.\n\n---\n\n### Screen: login — Đăng nhập tài khoản\n\n#### Wireframe (ASCII)\n\n```text\n+----------------------------------------------------------------------+\n|  english-ai-demo                                                     |\n|                                                                      |\n|                  +----------------------------------+                |\n|                  |        Dang nhap tai khoan        |               |\n|                  |                                   |               |\n|                  |  Email                            |               |\n|                  |  +-----------------------------+  |               |\n|                  |  | ban@email.com               |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |                                   |               |\n|                  |  Mat khau                         |               |\n|                  |  +-----------------------+-----+  |               |\n|                  |  | ........              | Hien|  |               |\n|                  |  +-----------------------+-----+  |               |\n|                  |                                   |               |\n|                  |  [ ] Ghi nho dang nhap  Quen MK?  |               |\n|                  |                                   |               |\n|                  |  [ captcha - hien sau 3 lan sai ] |               |\n|                  |                                   |               |\n|                  |  +-----------------------------+  |               |\n|                  |  |          Dang nhap          |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |                                   |               |\n|                  |  ----------  hoac  ------------   |               |\n|                  |                                   |               |\n|                  |  +-----------------------------+  |               |\n|                  |  |  (G)  Dang nhap voi Google  |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |                                   |               |\n|                  |  Chua co tai khoan?  Dang ky      |               |\n|                  +----------------------------------+                |\n+----------------------------------------------------------------------+\n```\n\n#### Screen description\n\n| # | Items | Control type | Data type | Description |\n|---|-------|--------------|-----------|-------------|\n| 1 | Email | Textbox | Text (email) | • **Mục đích**: định danh tài khoản đăng nhập (email là định danh duy nhất, BR-authentication-002).<br>• **Validation**: bắt buộc; kiểm định dạng email cơ bản. KHÔNG kiểm sự tồn tại của email tại đây (chống account enumeration, NFR-authentication-007).<br>• **States**: default rỗng + auto-focus khi tải; error viền đỏ nếu định dạng sai.<br>• **Placeholder** \"ban@email.com\".<br>• **Security**: không gợi ý/autocomplete lộ email đã đăng ký. |\n| 2 | Mật khẩu | Textbox (password) | Text | • **Mục đích**: xác thực chủ tài khoản.<br>• **Validation**: bắt buộc. Login KHÔNG validate chính sách mật khẩu (8-20/hoa/thường/đặc biệt) — chỉ so khớp với mật khẩu đã lưu; policy chỉ áp ở signup/reset (FR-003).<br>• **States**: masked mặc định, nút \"Hiện/Ẩn\" toggle hiển thị.<br>• **Security**: mật khẩu không lưu plaintext, không ghi log (NFR-authentication-003). |\n| 3 | Ghi nhớ đăng nhập | Checkbox | Boolean | • **Mục đích**: giữ phiên lâu cho người dùng đa thiết bị (FR-authentication-011, NFR-006).<br>• **Default OFF** (mặc định remember-me tắt).<br>• **Navigation/hệ quả**: tick → phiên giữ 30 ngày trên thiết bị đó; không tick → phiên phiên-làm-việc thường. |\n| 4 | Quên mật khẩu? | Link | Navigate | • **Mục đích**: lối vào khôi phục mật khẩu.<br>• **Navigation**: sang màn `forgot-password`. |\n| 5 | Captcha | Banner/Widget | ReadOnly (challenge) | • **Mục đích**: chống dò mật khẩu bằng thử lặp (NFR-authentication-005).<br>• **Display rule**: chỉ hiện khi tài khoản có ≥3 lần đăng nhập sai liên tiếp (FR-025, BR-authentication-006).<br>• **Validation khi hiện**: bắt buộc pass captcha mới cho submit.<br>• **States**: ẩn (fail 0-2) / hiện (fail ≥3). |\n| 6 | Đăng nhập | Button (Primary) | Click/Submit | • **Mục đích**: gửi thông tin đăng nhập, tạo phiên nếu hợp lệ (FR-authentication-008).<br>• **Validation**: disabled khi email/mật khẩu rỗng (và khi captcha hiện mà chưa pass).<br>• **States**: default / submitting (\"Đang đăng nhập...\", spinner, disabled) / error inline.<br>• **Navigation success**: tài khoản verified + không khóa + khớp → vào app (onboarding là feature riêng).<br>• **Error — sai thông tin**: `E-authentication-003` \"Email hoặc mật khẩu không đúng\" (thông báo chung, không lộ email nào tồn tại, FR-010); tăng bộ đếm sai +1.<br>• **Error — chưa xác nhận**: `E-authentication-004` \"Tài khoản chưa được xác nhận.\" + nút [Gửi lại email xác nhận] (FR-009).<br>• **Error — bị khóa**: `E-authentication-005` \"Tài khoản tạm khóa do nhiều lần đăng nhập sai. Vui lòng thử lại sau {X} giờ.\" khi ≥5 lần sai → khóa 24h tự mở (FR-026, BR-005).<br>• **Edge — lỗi mạng**: không tăng bộ đếm sai (FR-authentication-027, BR-011); hiển thị lỗi tạm và cho thử lại.<br>• **Performance**: hiển thị kết quả (vào app hoặc lỗi) trong 3 giây ở 95% trường hợp (NFR-001).<br>• **Accessibility**: nút + field có nhãn cho trình đọc màn hình, điều hướng bàn phím (NFR-009). |\n| 7 | Đăng nhập với Google | Button (Secondary) | Click | • **Mục đích**: đăng nhập/đăng ký một chạm qua Google, 1 luồng duy nhất không hỏi thêm field (FR-authentication-012).<br>• **Navigation success — email mới**: tạo tài khoản mới ở trạng thái `verified` (Google đã xác thực email, FR-013, BR-009) → vào app.<br>• **Navigation success — email trùng**: tự liên kết Google vào tài khoản đã có, không tạo trùng, không hỏi mật khẩu cũ (FR-014, BR-003) → vào app.<br>• **Error**: `E-authentication-008` \"Đăng nhập Google thất bại. Vui lòng thử lại.\" khi callback lỗi/mạng/người dùng hủy — không tạo tài khoản dở dang (FR-015).<br>• **Edge**: đóng tab consent giữa chừng = coi như thất bại; email Google khác hoàn toàn email cũ → tạo tài khoản riêng (không liên kết). |\n| 8 | Đăng ký | Link | Navigate | • **Mục đích**: lối vào tạo tài khoản mới.<br>• **Navigation**: sang màn `signup`. |\n\n---\n\n#### Flow: signup-verify\n\n**HTML wireframe (render):**\n\n<div class=\"wf-embed\"><style>\n.wf-embed .wf-page { max-width: 1400px; margin: 0 auto; }\n.wf-embed .wf-breadcrumb { max-width: 1400px; margin: 0 auto 16px; }\n.wf-embed .wf-breadcrumb a { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #000; text-decoration: none; border: 1px solid #000; border-radius: 4px; padding: 6px 12px; background: #fff; }\n.wf-embed .wf-breadcrumb a:hover { background: #f0f0f0; }\n.wf-embed html.in-iframe .wf-breadcrumb { display: none; }\n.wf-embed .wf-header { margin-bottom: 28px; border-bottom: 2px solid #000; padding-bottom: 14px; background: #fff; padding: 16px 20px; }\n.wf-embed .wf-feature-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; }\n.wf-embed .wf-flow-title { font-size: 22px; font-weight: 700; margin-top: 4px; }\n.wf-embed .wf-flow-meta { font-size: 12px; color: #888; margin-top: 6px; }\n.wf-embed .wf-flow-desc { font-size: 13px; color: #444; margin-top: 8px; line-height: 1.5; }\n.wf-embed .wf-rows { display: flex; flex-wrap: wrap; align "wf-feature-label\">Feature: authentication / Wireframe</div>\n<div class=\"wf-flow-title\">Đăng ký + xác nhận email</div>\n<div class=\"wf-flow-meta\">4 màn hình · Device: desktop 1024 · Cập nhật: 2026-07-17 · Nguồn: srs/authentication-userflow.md + ascii-wireframe/signup-verify.md</div>\n<div class=\"wf-flow-desc\">Người học tạo tài khoản bằng email + mật khẩu (policy 8-20 ký tự, cấm chứa phần đầu email), nhận email xác nhận hạn 24h, rồi click link. Hai trạng thái kết quả loại trừ nhau (thành công / hết hạn) tách 2 màn riêng theo ba-conventions Mục 8. Gửi lại có cooldown 60 giây, tối đa 5 lần/ngày.</div>\n</div>\n<div class=\"wf-rows\">\n<div class=\"wf-screen\" id=\"s1\">\n<div class=\"wf-step-badge\">1</div>\n<div class=\"wf-device-tag\">desktop · 1024px</div>\n<div class=\"wf-screen-frame\">\n<div class=\"wf-screen-bar\"><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><span class=\"wf-bar-title\">Tạo tài khoản mới</span></div>\n<div class=\"wf-screen-content\">\n<div class=\"wf-app-brand\">english-ai-demo</div>\n<div class=\"wf-form\">\n<div class=\"wf-screen-title\">Tạo tài khoản mới</div>\n<div class=\"field\">\n<label>Email [1]</label>\n<input type=\"email\" placeholder=\"ban@email.com\">\n<span class=\"state-hint\">Bắt buộc · lỗi trùng E-001 inline (FR-002)</span>\n</div>\n<div class=\"field\">\n<label>Mật khẩu [2]</label>\n<div class=\"input-pw\"><input type=\"password\"><span class=\"eye\">Hiện</span></div>\n</div>\n<div class=\"meter\">\n<span class=\"meter-label\">Độ mạnh [3]: Trung bình</span>\n<div class=\"meter-track\"><div class=\"meter-fill\" style=\"width:50%\"></div></div>\n</div>\n<div class=\"policy-note\">8-20 ký tự, có chữ hoa/thường/ký tự đặc biệt; không chứa phần đầu email (FR-003, E-002)</div>\n<div class=\"captcha-box\">[4] Captcha chống bot (FR-031)</div>\n<button class=\"btn-primary\">Đăng ký [5]</button>\n<div class=\"links-center\">Đã có tài khoản? <a class=\"wf-link\">Đăng nhập [6]</a></div>\n</div>\n</div>\n</div>\n<div class=\"wf-screen-label\">signup</div>\n</div>\n<div class=\"wf-screen\" id=\"s2\">\n<div class=\"wf-step-badge\">2</div>\n<div class=\"wf-device-tag\">desktop · 1024px</div>\n<div class=\"wf-screen-frame\">\n<div class=\"wf-screen-bar\"><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><span class=\"wf-bar-title\">Kiểm tra hộp thư</span></div>\n<div class=\"wf-screen-content\">\n<div class=\"wf-app-brand\">english-ai-demo</div>\n<div class=\"wf-form\">\n<div class=\"wf-screen-title\">Kiểm tra hộp thư của bạn</div>\n<div class=\"info-block\">\nĐã gửi email xác nhận tới\n<strong>ban@email.com [1]</strong>\nBấm link trong email để kích hoạt tài khoản. Link có hạn 24 giờ. [2]\n</div>\n<div class=\"links-center\" style=\"color:#888;font-size:11px;\">Chưa nhận được email? (kiểm tra cả thư rác)</div>\n<button class=\"btn-secondary\">Gửi lại email xác nhận [3]</button>\n<div class=\"state-hint\" style=\"text-align:center;\">Có thể gửi lại sau 60 giây · tối đa 5 lần/ngày (E-007)</div>\n<div class=\"links-center\">Quay lại <a class=\"wf-link\">Đăng nhập [4]</a></div>\n</div>\n</div>\n</div>\n<div class=\"wf-screen-label\">verify-sent</div>\n</div>\n<div class=\"wf-screen\" id=\"s3\">\n<div class=\"wf-step-badge\">3</div>\n<div class=\"wf-device-tag\">desktop · 1024px</div>\n<div class=\"wf-screen-frame\">\n<div class=\"wf-screen-bar\"><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><span class=\"wf-bar-title\">Xác nhận thành công</span></div>\n<div class=\"wf-screen-content\">\n<div class=\"wf-app-brand\">english-ai-demo</div>\n<div class=\"wf-form\">\n<div class=\"result-icon\">&#10003;</div>\n<div class=\"wf-screen-title\">Xác nhận email thành công!</div>\n<div class=\"result-text\">[1] Tài khoản đã được kích hoạt. Vui lòng đăng nhập để bắt đầu.</div>\n<button class=\"btn-primary\">Đến trang đăng nhập [2]</button>\n</div>\n</div>\n</div>\n<div class=\"wf-screen-label\">verify-result-success</div>\n</div>\n<div class=\"wf-screen\" id=\"s4\">\n<div class=\"wf-step-badge\">4</div>\n<div class=\"wf-device-tag\">desktop · 1024px</div>\n<div class=\"wf-screen-frame\">\n<div class=\"wf-screen-bar\"><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><span class=\"wf-bar-title\">Link hết hạn</span></div>\n<div class=\"wf-screen-content\">\n<div class=\"wf-app-brand\">english-ai-demo</div>\n<div class=\"wf-form\">\n<div class=\"result-icon\">!</div>\n<div class=\"wf-screen-title\">Link đã hết hạn hoặc đã dùng</div>\n<div class=\"result-text\">[1] Link xác nhận này không còn hợp lệ (E-006). Gửi lại link mới để tiếp tục.</div>\n<button class=\"btn-primary\">Gửi lại link xác nhận [2]</button>\n<div class=\"links-center\">Quay lại <a class=\"wf-link\">Đăng nhập [3]</a></div>\n</div>\n</div>\n</div>\n<div class=\"wf-screen-label\">verify-result-expired</div>\n</div>\n</div>\n<div class=\"wf-desc-section\">\n<div class=\"wf-desc-title\">Mô tả màn hình</div>\n<table class=\"wf-desc-table\">\n<thead><tr><th>#</th><th>Items</th><th>Control type</th><th>Data type</th><th>Description</th></tr></thead>\n<tbody>\n<tr class=\"wf-desc-screen-header\"><td colspan=\"5\">Screen 1: signup — Tạo tài khoản mới</td></tr>\n<tr><td>1</td><td>Email</td><td>Textbox</td><td>Text (email)</td><td>• <strong>Mục đích</strong>: định danh tài khoản mới (BR-authentication-002).<br>• <strong>Validation</strong>: bắt buộc; kiểm định dạng; auto-focus.<br>• <strong>Error trùng</strong>: E-authentication-001 inline \"Email này đã được đăng ký. Bạn muốn [đăng nhập] hoặc [quên mật khẩu]?\" (FR-002) — chặn tạo trùng.<br>• <strong>Placeholder</strong> \"ban@email.com\".</td></tr>\n<tr><td>2</td><td>Mật khẩu</td><td>Textbox (password)</td><td>Text</td><td>• <strong>Mục đích</strong>: đặt mật khẩu cho phương thức email.<br>• <strong>Validation (FR-003)</strong>: 8-20 ký tự, ≥1 chữ hoa, ≥1 chữ thường, ≥1 ký tự đặc biệt, KHÔNG chứa phần đầu email (local-part ≥3 ký tự).<br>• <strong>Error</strong>: E-authentication-002 inline real-time.<br>• <strong>States</strong>: masked + Hiện/Ẩn; validate real-time.</td></tr>\n<tr><td>3</td><td>Độ mạnh mật khẩu</td><td>Meter</td><td>ReadOnly</td><td>• <strong>Mục đích</strong>: gợi ý đặt mật khẩu mạnh hơn (FR-029, P1).<br>• <strong>Display</strong>: cập nhật real-time; Yếu/Trung bình/Mạnh (gợi ý, không thay validation cứng FR-003).</td></tr>\n<tr><td>4</td><td>Captcha chống bot</td><td>Widget</td><td>ReadOnly (challenge)</td><td>• <strong>Mục đích</strong>: chống đăng ký hàng loạt bằng bot (FR-031, P1).<br>• <strong>Validation</strong>: phải pass mới cho submit.<br>• <strong>Note</strong>: khác captcha login (login hiện sau 3 lần sai).</td></tr>\n<tr><td>5</td><td>Đăng ký</td><td>Button (Primary)</td><td>Click/Submit</td><td>• <strong>Mục đích</strong>: tạo tài khoản unverified + kích hoạt gửi email xác nhận (FR-001, FR-004).<br>• <strong>Enable</strong>: disabled khi field chưa hợp lệ / captcha chưa pass.<br>• <strong>Success</strong>: gửi email xác nhận link hạn 24h → sang màn verify-sent.<br>• <strong>Business rule</strong>: phải xác nhận email trước khi truy cập nội dung học (BR-001).<br>• <strong>Edge</strong>: tài khoản unverified quá 24h bị tự xóa (FR-028, BR-010).</td></tr>\n<tr><td>6</td><td>Đăng nhập</td><td>Link</td><td>Navigate</td><td>• <strong>Navigate</strong> sang màn login.</td></tr>\n<tr class=\"wf-desc-screen-header\"><td colspan=\"5\">Screen 2: verify-sent — Đã gửi email xác nhận</td></tr>\n<tr><td>1</td><td>Địa chỉ email đã gửi</td><td>Label</td><td>ReadOnly</td><td>• <strong>Mục đích</strong>: xác nhận email đã gửi tới đúng địa chỉ (FR-004).<br>• <strong>Nội dung</strong>: hiển thị email vừa nhập; nhắc kiểm tra spam.</td></tr>\n<tr><td>2</td><td>Ghi chú hạn link</td><td>Label</td><td>ReadOnly</td><td>• <strong>Nội dung</strong>: \"Link có hạn 24 giờ\" (FR-004).</td></tr>\n<tr><td>3</td><td>Gửi lại email xác nhận</td><td>Button (Secondary)</td><td>Click</td><td>• <strong>Mục đích</strong>: gửi lại link mới (FR-007).<br>• <strong>Ràng buộc</strong>: cooldown 60 giây; tối đa 5 lần/ngày.<br>• <strong>States</strong>: enabled → disabled (đếm ngược) → enabled.<br>• <strong>Error</strong>: E-authentication-007 khi trong cooldown hoặc đủ 5 lần/ngày.<br>• <strong>OQ</strong>: mốc reset quota \"5 lần/ngày\" chưa chốt — userflow OQ-2.</td></tr>\n<tr><td>4</td><td>Đăng nhập</td><td>Link</td><td>Navigate</td><td>• <strong>Navigate</strong> sang màn login.</td></tr>\n<tr class=\"wf-desc-screen-header\"><td colspan=\"5\">Screen 3: verify-result-success — Xác nhận email thành công</td></tr>\n<tr><td>1</td><td>Thông báo thành công</td><td>Label</td><td>ReadOnly</td><td>• <strong>Mục đích</strong>: xác nhận link còn hạn + chưa dùng được chấp nhận, tài khoản sang verified (FR-005).<br>• <strong>Nội dung</strong>: \"Xác nhận email thành công! Vui lòng đăng nhập.\"<br>• <strong>Trigger</strong>: bấm link xác nhận hợp lệ trong 24h; link đánh dấu đã dùng.</td></tr>\n<tr><td>2</td><td>Đến trang đăng nhập</td><td>Button (Primary)</td><td>Click/Navigate</td><td>• <strong>Navigate</strong> sang màn login.<br>• <strong>Edge</strong>: 2 thiết bị cùng bấm 1 link — lần đầu thành công, lần sau rơi \"đã dùng\" → xem verify-result-expired.</td></tr>\n<tr class=\"wf-desc-screen-header\"><td colspan=\"5\">Screen 4: verify-result-expired — Link xác nhận hết hạn</td></tr>\n<tr><td>1</td><td>Thông báo hết hạn</td><td>Label</td><td>ReadOnly</td><td>• <strong>Mục đích</strong>: báo link đã quá 24h hoặc đã dùng, bị từ chối (FR-006).<br>• <strong>Error</strong>: E-authentication-006 \"Link đã hết hạn hoặc đã được sử dụng.\"<br>• <strong>Trigger</strong>: bấm link không còn hợp lệ (gồm thiết bị thứ 2 bấm lại cùng link).</td></tr>\n<tr><td>2</td><td>Gửi lại link xác nhận</td><td>Button (Primary)</td><td>Click</td><td>• <strong>Mục đích</strong>: phát hành link mới (FR-007).<br>• <strong>Ràng buộc</strong>: cùng cooldown 60s + tối đa 5 lần/ngày.<br>• <strong>Error</strong>: E-authentication-007 khi vượt cooldown/giới hạn.<br>• <strong>Success</strong>: gửi lại xong → quay về verify-sent.</td></tr>\n<tr><td>3</td><td>Đăng nhập</td><td>Link</td><td>Navigate</td><td>• <strong>Navigate</strong> sang màn login.</td></tr>\n</tbody>\n</table>\n</div>\n<div class=\"wf-footer\"><span>authentication / signup-verify</span><span>Tạo bởi /wireframe-html · 2026-07-20</span></div>\n</div>\n<script>if (window.self !== window.top) document.documentElement.classList.add('in-iframe');<\/script>\n</div>\n\n\n**ASCII wireframe + mô tả:**\n\n> Màn hình: signup → verify-sent → verify-result-success / verify-result-expired. Flow tổng xem `../srs/authentication-userflow.md`. Device: desktop 1024, form căn giữa box hẹp ~400px. Hai trạng thái loại trừ nhau của trang kết quả xác nhận (thành công / hết hạn) tách 2 screen riêng theo `ba-conventions.md` Mục 8.\n\n---\n\n### Screen: signup — Tạo tài khoản mới\n\n#### Wireframe (ASCII)\n\n```text\n+----------------------------------------------------------------------+\n|  english-ai-demo                                                     |\n|                  +----------------------------------+                |\n|                  |        Tao tai khoan moi          |               |\n|                  |  Email                            |               |\n|                  |  +-----------------------------+  |               |\n|                  |  | ban@email.com               |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  Mat khau                         |               |\n|                  |  +-----------------------+-----+  |               |\n|                  |  | ........              | Hien|  |               |\n|                  |  +-----------------------+-----+  |               |\n|                  |  Do manh: [====------] Trung binh |               |\n|                  |  8-20 ky tu, hoa/thuong/dac biet; |               |\n|                  |  khong chua phan dau email        |               |\n|                  |  [ captcha chong bot ]            |               |\n|                  |  +-----------------------------+  |               |\n|                  |  |           Dang ky           |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  Da co tai khoan?  Dang nhap      |               |\n|                  +----------------------------------+                |\n+----------------------------------------------------------------------+\n```\n\n#### Screen description\n\n| # | Items | Control type | Data type | Description |\n|---|-------|--------------|-----------|-------------|\n| 1 | Email | Textbox | Text (email) | • **Mục đích**: định danh tài khoản mới (BR-authentication-002).<br>• **Validation**: bắt buộc; kiểm định dạng email; auto-focus khi tải.<br>• **Error — trùng**: `E-authentication-001` inline \"Email này đã được đăng ký. Bạn muốn [đăng nhập] hoặc [quên mật khẩu]?\" (FR-002) — chặn tạo tài khoản trùng.<br>• **Placeholder** \"ban@email.com\". |\n| 2 | Mật khẩu | Textbox (password) | Text | • **Mục đích**: đặt mật khẩu cho phương thức email.<br>• **Validation (FR-003)**: 8-20 ký tự, ≥1 chữ hoa, ≥1 chữ thường, ≥1 ký tự đặc biệt, KHÔNG chứa phần đầu email (local-part ≥3 ký tự, không phân biệt hoa/thường).<br>• **Error**: `E-authentication-002` inline real-time \"Mật khẩu cần 8-20 ký tự, có chữ hoa, chữ thường và ký tự đặc biệt, và không chứa phần đầu email của bạn.\"<br>• **States**: masked + nút Hiện/Ẩn; validate real-time. |\n| 3 | Độ mạnh mật khẩu | Meter | ReadOnly | • **Mục đích**: gợi ý đặt mật khẩu mạnh hơn (FR-029, P1).<br>• **Display**: cập nhật real-time; Yếu/Trung bình/Mạnh (gợi ý, không thay validation cứng FR-003). |\n| 4 | Captcha chống bot | Widget | ReadOnly (challenge) | • **Mục đích**: chống đăng ký hàng loạt bằng bot (FR-031, P1).<br>• **Validation**: phải pass mới cho submit.<br>• **Note**: khác captcha login (login hiện sau 3 lần sai). |\n| 5 | Đăng ký | Button (Primary) | Click/Submit | • **Mục đích**: tạo tài khoản `unverified` + kích hoạt gửi email xác nhận (FR-001, FR-004).<br>• **Validation**: disabled khi field chưa hợp lệ / captcha chưa pass.<br>• **Navigation success**: gửi email xác nhận link hạn 24h → sang màn `verify-sent`.<br>• **Business rule**: phải xác nhận email trước khi truy cập nội dung học (BR-001).<br>• **Edge**: tài khoản `unverified` quá 24h bị tự xóa (FR-028, BR-010). |\n| 6 | Đăng nhập | Link | Navigate | • **Navigation**: sang màn `login`. |\n\n---\n\n### Screen: verify-sent — Đã gửi email xác nhận\n\n#### Wireframe (ASCII)\n\n```text\n+----------------------------------------------------------------------+\n|  english-ai-demo                                                     |\n|                  +----------------------------------+                |\n|                  |      Kiem tra hop thu cua ban     |               |\n|                  |  Da gui email xac nhan toi        |               |\n|                  |  ban@email.com                    |               |\n|                  |  Bam link trong email de kich     |               |\n|                  |  hoat tai khoan. Link co han 24h. |               |\n|                  |  Chua nhan duoc email?            |               |\n|                  |  +-----------------------------+  |               |\n|                  |  |   Gui lai email xac nhan    |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  Co the gui lai sau 60 giay       |               |\n|                  |  Quay lai  Dang nhap              |               |\n|                  +----------------------------------+                |\n+----------------------------------------------------------------------+\n```\n\n#### Screen description\n\n| # | Items | Control type | Data type | Description |\n|---|-------|--------------|-----------|-------------|\n| 1 | Địa chỉ email đã gửi | Label | ReadOnly | • **Mục đích**: xác nhận email đã gửi tới đúng địa chỉ (FR-004).<br>• **Nội dung**: hiển thị email vừa nhập; nhắc kiểm tra spam. |\n| 2 | Ghi chú hạn link | Label | ReadOnly | • **Nội dung**: \"Link có hạn 24 giờ\" (FR-004). |\n| 3 | Gửi lại email xác nhận | Button (Secondary) | Click | • **Mục đích**: gửi lại link mới (FR-007).<br>• **Ràng buộc**: cooldown 60 giây; tối đa 5 lần/ngày.<br>• **States**: enabled → disabled (đếm ngược) → enabled.<br>• **Error**: `E-authentication-007` khi trong cooldown hoặc đủ 5 lần/ngày.<br>• **OQ**: mốc reset quota \"5 lần/ngày\" (lịch 00:00 hay cửa sổ trượt 24h) chưa chốt — userflow OQ-2. |\n| 4 | Đăng nhập | Link | Navigate | • **Navigation**: sang màn `login`. |\n\n---\n\n### Screen: verify-result-success — Xác nhận email thành công\n\n#### Wireframe (ASCII)\n\n```text\n+----------------------------------------------------------------------+\n|  english-ai-demo                                                     |\n|                  +----------------------------------+                |\n|                  |              [ v ]                |               |\n|                  |   Xac nhan email thanh cong!      |               |\n|                  |  Tai khoan da duoc kich hoat.     |               |\n|                  |  Vui long dang nhap de bat dau.   |               |\n|                  |  +-----------------------------+  |               |\n|                  |  |      Den trang dang nhap    |  |               |\n|                  |  +-----------------------------+  |               |\n|                  +----------------------------------+                |\n+----------------------------------------------------------------------+\n```\n\n#### Screen description\n\n| # | Items | Control type | Data type | Description |\n|---|-------|--------------|-----------|-------------|\n| 1 | Thông báo thành công | Label | ReadOnly | • **Mục đích**: xác nhận link còn hạn + chưa dùng được chấp nhận, tài khoản sang `verified` (FR-005).<br>• **Nội dung**: \"Xác nhận email thành công! Vui lòng đăng nhập.\"<br>• **Trigger**: bấm link xác nhận hợp lệ trong 24h; link đánh dấu đã dùng. |\n| 2 | Đến trang đăng nhập | Button (Primary) | Click/Navigate | • **Navigation**: sang màn `login`.<br>• **Edge**: 2 thiết bị cùng bấm 1 link — lần đầu thành công, lần sau rơi \"đã dùng\" → xem `verify-result-expired`. |\n\n---\n\n### Screen: verify-result-expired — Link xác nhận hết hạn\n\n#### Wireframe (ASCII)\n\n```text\n+----------------------------------------------------------------------+\n|  english-ai-demo                                                     |\n|                  +----------------------------------+                |\n|                  |              [ ! ]                |               |\n|                  |   Link da het han hoac da dung    |               |\n|                  |  Link xac nhan nay khong con hop  |               |\n|                  |  le. Gui lai link moi de tiep.    |               |\n|                  |  +-----------------------------+  |               |\n|                  |  |    Gui lai link xac nhan    |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  Quay lai  Dang nhap              |               |\n|                  +----------------------------------+                |\n+----------------------------------------------------------------------+\n```\n\n#### Screen description\n\n| # | Items | Control type | Data type | Description |\n|---|-------|--------------|-----------|-------------|\n| 1 | Thông báo hết hạn | Label | ReadOnly | • **Mục đích**: báo link đã quá 24h hoặc đã dùng, bị từ chối (FR-006).<br>• **Error**: `E-authentication-006` \"Link đã hết hạn hoặc đã được sử dụng.\"<br>• **Trigger**: bấm link không còn hợp lệ (gồm thiết bị thứ 2 bấm lại cùng link). |\n| 2 | Gửi lại link xác nhận | Button (Primary) | Click | • **Mục đích**: phát hành link mới (FR-007).<br>• **Ràng buộc**: cùng cooldown 60s + tối đa 5 lần/ngày.<br>• **Error**: `E-authentication-007` khi vượt cooldown/giới hạn.<br>• **Navigation success**: gửi lại xong → quay về `verify-sent`. |\n| 3 | Đăng nhập | Link | Navigate | • **Navigation**: sang màn `login`. |\n\n---\n\n#### Flow: unlink-google\n\n**HTML wireframe (render):**\n\n<div class=\"wf-embed\"><style>\n.wf-embed .wf-page { max-width: 1400px; margin: 0 auto; }\n.wf-embed .wf-breadcrumb { max-width: 1400px; margin: 0 auto 16px; }\n.wf-embed .wf-breadcrumb a { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #000; text-decoration: none; border: 1px solid #000; border-radius: 4px; padding: 6px 12px; background: #fff; }\n.wf-embed .wf-breadcrumb a:hover { background: #f0f0f0; }\n.wf-embed html.in-iframe .wf-breadcrumb { display: none; }\n.wf-embed .wf-header { margin-bottom: 28px; border-bottom: 2px solid #000; padding-bottom: 14px; background: #fff; padding: 16px 20px; }\n.wf-embed .wf-feature-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; }\n.wf-embed .wf-flow-title { font-size: 22px; font-weight: 700; margin-top: 4px; }\n.wf-embed .wf-flow-meta { font-size: 12px; color: #888; margin-top: 6px; }\n.wf-embed .wf-flow-desc { font-size: 13px; color: #444; margin-top: 8px; line-height: 1.5; }\n.wf-embed .wf-rows { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 24px 16px; }\n.wf-embed .wf-screen { flex: 0 0 auto; }\n.wf-embed .wf-page[data-device=\"desktop\"] .wf-screen { width: 1024px; max-width: 100%; }\n.wf-embed .wf-device-tag { display: inline-block; font-size: 10px; color: #555; border: 1px solid #ccc; border-radius: 3px; padding: 1px 6px; margin-bottom: 6px; }\n.wf-embed .wf-step-badge { font-size: 10px; font-weight: 700; color: #fff; background: #000; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }\n.wf-e -table th { background: #f0f0f0; font-weight: 700; font-size: 11px; text-transform: uppercase; }\n.wf-embed .wf-desc-table td:first-child, .wf-embed .wf-desc-table th:first-child { width: 34px; text-align: center; }\n.wf-embed .wf-desc-table td:nth-child(2) { width: 180px; }\n.wf-embed .wf-desc-table td:nth-child(3) { width: 140px; }\n.wf-embed .wf-desc-table td:nth-child(4) { width: 90px; }\n.wf-embed .wf-desc-screen-header td { background: #000; color: #fff; font-weight: 700; font-size: 12px; }\n</style>\n<div class=\"wf-breadcrumb\"><a href=\"authentication-wireframe.html\">← Mục lục wireframe (tất cả flow)</a></div>\n<div class=\"wf-page\" data-device=\"desktop\">\n<div class=\"wf-header\">\n<div class=\"wf-feature-label\">Feature: authentication / Wireframe</div>\n<div class=\"wf-flow-title\">Gỡ liên kết Google</div>\n<div class=\"wf-flow-meta\">1 màn hình (trang cài đặt full-content + dialog hẹp) · Device: desktop 1024 · Cập nhật: 2026-07-17 · Nguồn: srs/authentication-userflow.md + ascii-wireframe/unlink-google.md</div>\n<div class=\"wf-flow-desc\">Trang bảo mật cho người đã đăng nhập: gỡ liên kết Google (gỡ ngay nếu đã có mật khẩu, buộc tạo mật khẩu trước nếu chưa có — E-010), xem danh sách thiết bị đang đăng nhập với đăng xuất từ xa (P1). Dialog \"tạo mật khẩu trước khi gỡ\" là hộp hẹp căn giữa theo ba-conventions Mục 8.</div>\n</div>\n<div class=\"wf-rows\">\n<div class=\"wf-screen\" id=\"s1\">\n<div class=\"wf-step-badge\">1</div>\n<div class=\"wf-device-tag\">desktop · 1024px · full-content</div>\n<div class=\"wf-screen-frame\">\n<div class=\"wf-screen-bar\"><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><div class=\"wf-dot\"></div><span class=\"wf-bar-title\">Bảo mật tài khoản</span></div>\n<div class=\"wf-screen-content\">\n<div class=\"settings-title\">Bảo mật tài khoản</div>\n<div class=\"panel-title\">Phương thức đăng nhập</div>\n<div class=\"panel-box\">\n<div class=\"panel-row\">\n<div class=\"r-main\"><span>Email + mật khẩu</span></div>\n<div class=\"r-status\">Đã thiết lập [1]</div>\n<div style=\"min-width:110px;\"></div>\n</div>\n<div class=\"panel-row\">\n<div class=\"r-main\"><span><span class=\"g-icon\">G</span> Google (ban@email.com)</span><span class=\"r-sub\">Đã liên kết</span></div>\n<div class=\"r-status\">&nbsp;</div>\n<button class=\"btn-danger\">Gỡ liên kết [2]</button>\n</div>\n</div>\n<div class=\"panel-title\">Thiết bị đang đăng nhập [3]</div>\n<div class=\"panel-box\">\n<div class=\"panel-row\">\n<div class=\"r-main\"><span>Chrome - Windows - HCM</span></div>\n<div class=\"r-status\">Hiện tại</div>\n<div style=\"min-width:110px;\"></div>\n</div>\n<div class=\"panel-row\">\n<div class=\"r-main\"><span>Safari - iPhone - HN</span><span class=\"r-sub\">2 giờ trước</span></div>\n<div class=\"r-status\">&nbsp;</div>\n<button class=\"btn-outline\">Đăng xuất [4]</button>\n</div>\n</div>\n<div class=\"dialog-wrap\">\n<div class=\"dialog-caption\">Dialog — chỉ hiện khi tài khoản CHƯA có mật khẩu (trigger E-010)</div>\n<div class=\"wf-form\">\n<div class=\"dialog-title\">Tạo mật khẩu trước khi gỡ</div>\n<div class=\"dialog-text\">Tài khoản này đăng nhập bằng Google và chưa có mật khẩu. Hãy tạo mật khẩu để không mất lối vào tài khoản.</div>\n<div class=\"field\">\n<label>Mật khẩu mới [5]</label>\n<input type=\"password\">\n<span class=\"policy-note\">8-20 ký tự, hoa/thường/ký tự đặc biệt, không chứa phần đầu email (FR-003, E-002)</span>\n</div>\n<button class=\"btn-primary\">Tạo mật khẩu và gỡ Google [6]</button>\n<div class=\"links-center\"><a class=\"wf-link\">Hủy</a></div>\n</div>\n</div>\n</div>\n</div>\n<div class=\"wf-screen-label\">account-security</div>\n</div>\n</div>\n<div class=\"wf-desc-section\">\n<div class=\"wf-desc-title\">Mô tả màn hình</div>\n<table class=\"wf-desc-table\">\n<thead><tr><th>#</th><th>Items</th><th>Control type</th><th>Data type</th><th>Description</th></tr></thead>\n<tbody>\n<tr class=\"wf-desc-screen-header\"><td colspan=\"5\">Screen 1: account-security — Bảo mật tài khoản</td></tr>\n<tr><td>1</td><td>Trạng thái email + mật khẩu</td><td>Label</td><td>ReadOnly</td><td>• <strong>Mục đích</strong>: cho biết tài khoản đã có phương thức email/mật khẩu chưa — quyết định luồng gỡ Google.<br>• <strong>Nội dung</strong>: \"Đã thiết lập\" nếu có mật khẩu; \"Chưa có mật khẩu\" nếu tài khoản gốc tạo qua Google (Credential có thể trống).</td></tr>\n<tr><td>2</td><td>Gỡ liên kết Google</td><td>Button (Secondary/Danger)</td><td>Click</td><td>• <strong>Mục đích</strong>: gỡ liên kết Google khỏi tài khoản.<br>• <strong>Navigate — đã có mật khẩu</strong>: gỡ ngay, giữ đăng nhập email/mật khẩu (FR-023, không hộp thoại xác nhận).<br>• <strong>Navigate — chưa có mật khẩu</strong>: E-authentication-010 — mở dialog \"Tạo mật khẩu trước khi gỡ\" (element #5), KHÔNG gỡ cho tới khi tạo mật khẩu (FR-024, BR-004).<br>• <strong>Business rule</strong>: phải có mật khẩu trước khi gỡ để tránh mất lối vào tài khoản (BR-004).<br>• <strong>Audit</strong>: sự kiện gỡ/tự liên kết Google được ghi vết (NFR-008).</td></tr>\n<tr><td>3</td><td>Thiết bị đang đăng nhập</td><td>List</td><td>ReadOnly</td><td>• <strong>Mục đích</strong>: cho người dùng thấy thiết bị đang có phiên (FR-030, P1).<br>• <strong>Nội dung</strong>: mỗi dòng thiết bị + thời điểm; đánh dấu \"Hiện tại\".<br>• <strong>Note</strong>: đăng nhập nhiều thiết bị không giới hạn, phiên không tự hết hạn (FR-021).</td></tr>\n<tr><td>4</td><td>Đăng xuất (mỗi thiết bị)</td><td>Button (Secondary)</td><td>Click</td><td>• <strong>Mục đích</strong>: đăng xuất từ xa một thiết bị (FR-030, P1).<br>• <strong>Hệ quả</strong>: thu hồi phiên thiết bị đó, không ảnh hưởng thiết bị khác (đối chiếu FR-022 cho thiết bị hiện tại).</td></tr>\n<tr><td>5</td><td>Dialog: Mật khẩu mới</td><td>Textbox (password)</td><td>Text</td><td>• <strong>Mục đích</strong>: buộc tạo mật khẩu đạt chính sách trước khi gỡ Google (FR-024).<br>• <strong>Validation (FR-003)</strong>: 8-20 ký tự, hoa/thường/ký tự đặc biệt, không chứa phần đầu email.<br>• <strong>Error</strong>: E-authentication-002 nếu không đạt.<br>• <strong>Display rule</strong>: dialog chỉ mở khi tài khoản chưa có mật khẩu (trigger E-010).</td></tr>\n<tr><td>6</td><td>Dialog: Tạo mật khẩu và gỡ Google</td><td>Button (Primary)</td><td>Click/Submit</td><td>• <strong>Mục đích</strong>: đặt mật khẩu rồi mới gỡ Google trong cùng thao tác (FR-024, BR-004).<br>• <strong>Success</strong>: lưu mật khẩu → gỡ Google → giữ đăng nhập email/mật khẩu.<br>• <strong>Edge</strong>: bấm \"Hủy\" giữa chừng → dialog đóng, KHÔNG gỡ liên kết (Google vẫn còn).</td></tr>\n</tbody>\n</table>\n</div>\n<div class=\"wf-footer\"><span>authentication / unlink-google</span><span>Tạo bởi /wireframe-html · 2026-07-17</span></div>\n</div>\n<script>if (window.self !== window.top) document.documentElement.classList.add('in-iframe');<\/script>\n</div>\n\n\n**ASCII wireframe + mô tả:**\n\n> Màn hình: account-security. Flow tổng xem `../srs/authentication-userflow.md`. Device: desktop 1024. Trang cài đặt cho người đã đăng nhập (full-content) — nhưng hộp thoại \"tạo mật khẩu trước khi gỡ\" là dialog hẹp căn giữa (~400px) theo Mục 8.\n\n---\n\n### Screen: account-security — Bảo mật tài khoản\n\n#### Wireframe (ASCII)\n\n```text\n+----------------------------------------------------------------------+\n|  english-ai-demo          Bao mat tai khoan                          |\n|                                                                      |\n|  Phuong thuc dang nhap                                               |\n|  +----------------------------------------------------------------+  |\n|  |  Email + mat khau           Da thiet lap                       |  |\n|  |  (G) Google (ban@email.com) Da lien ket      [ Go lien ket ]   |  |\n|  +----------------------------------------------------------------+  |\n|                                                                      |\n|  Thiet bi dang dang nhap                                             |\n|  +----------------------------------------------------------------+  |\n|  |  Chrome - Windows - HCM      Hien tai                          |  |\n|  |  Safari - iPhone - HN        2 gio truoc     [ Dang xuat ]     |  |\n|  +----------------------------------------------------------------+  |\n|                                                                      |\n|  Dialog (khi tai khoan CHUA co mat khau - E-010):                    |\n|                  +----------------------------------+                |\n|                  |     Tao mat khau truoc khi go     |               |\n|                  |  Tai khoan nay dang nhap bang     |               |\n|                  |  Google va chua co mat khau. Hay  |               |\n|                  |  tao mat khau de khong mat loi    |               |\n|                  |  vao tai khoan.                   |               |\n|                  |  Mat khau moi                     |               |\n|                  |  +-----------------------------+  |               |\n|                  |  | ........                    |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  8-20 ky tu, hoa/thuong/dac biet  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  |   Tao mat khau va go Google |  |               |\n|                  |  +-----------------------------+  |               |\n|                  |  Huy                              |               |\n|                  +----------------------------------+                |\n+----------------------------------------------------------------------+\n```\n\n#### Screen description\n\n| # | Items | Control type | Data type | Description |\n|---|-------|--------------|-----------|-------------|\n| 1 | Trạng thái email + mật khẩu | Label | ReadOnly | • **Mục đích**: cho biết tài khoản đã có phương thức email/mật khẩu chưa — quyết định luồng gỡ Google.<br>• **Nội dung**: \"Đã thiết lập\" nếu có mật khẩu; \"Chưa có mật khẩu\" nếu tài khoản gốc tạo qua Google (Credential có thể trống). |\n| 2 | Gỡ liên kết Google | Button (Secondary/Danger) | Click | • **Mục đích**: gỡ liên kết Google khỏi tài khoản.<br>• **Navigation — đã có mật khẩu**: gỡ ngay, giữ đăng nhập email/mật khẩu (FR-023, không hộp thoại xác nhận).<br>• **Navigation — chưa có mật khẩu**: `E-authentication-010` — mở dialog \"Tạo mật khẩu trước khi gỡ\" (element #5), KHÔNG gỡ cho tới khi tạo mật khẩu (FR-024, BR-004).<br>• **Business rule**: phải có mật khẩu trước khi gỡ để tránh mất lối vào tài khoản (BR-004).<br>• **Audit**: sự kiện gỡ/tự liên kết Google được ghi vết (NFR-008). |\n| 3 | Thiết bị đang đăng nhập | List | ReadOnly | • **Mục đích**: cho người dùng thấy thiết bị đang có phiên (FR-030, P1).<br>• **Nội dung**: mỗi dòng thiết bị + thời điểm; đánh dấu \"Hiện tại\".<br>• **Note**: đăng nhập nhiều thiết bị không giới hạn, phiên không tự hết hạn (FR-021). |\n| 4 | Đăng xuất (mỗi thiết bị) | Button (Secondary) | Click | • **Mục đích**: đăng xuất từ xa một thiết bị (FR-030, P1).<br>• **Hệ quả**: thu hồi phiên thiết bị đó, không ảnh hưởng thiết bị khác (đối chiếu FR-022 cho thiết bị hiện tại). |\n| 5 | Dialog: Mật khẩu mới | Textbox (password) | Text | • **Mục đích**: buộc tạo mật khẩu đạt chính sách trước khi gỡ Google (FR-024).<br>• **Validation (FR-003)**: 8-20 ký tự, hoa/thường/ký tự đặc biệt, không chứa phần đầu email.<br>• **Error**: `E-authentication-002` nếu không đạt.<br>• **Display rule**: dialog chỉ mở khi tài khoản chưa có mật khẩu (trigger E-010). |\n| 6 | Dialog: Tạo mật khẩu và gỡ Google | Button (Primary) | Click/Submit | • **Mục đích**: đặt mật khẩu rồi mới gỡ Google trong cùng thao tác (FR-024, BR-004).<br>• **Navigation success**: lưu mật khẩu → gỡ Google → giữ đăng nhập email/mật khẩu.<br>• **Edge**: bấm \"Hủy\" giữa chừng → dialog đóng, KHÔNG gỡ liên kết (Google vẫn còn). |\n\n\n## 9. Designs\n\n| Screen | Status | Figma frame | HTML prototype | Updated |\n|---|---|---|---|---|\n| `login` | draft | — | — | 2026-07-17 |\n| `signup` | draft | — | — | 2026-07-17 |\n| `verify-sent` | draft | — | — | 2026-07-17 |\n| `verify-result-success` | draft | — | — | 2026-07-17 |\n| `verify-result-expired` | draft | — | — | 2026-07-17 |\n| `forgot-password` | draft | — | — | 2026-07-17 |\n| `reset-password` | draft | — | — | 2026-07-17 |\n| `reset-result-success` | draft | — | — | 2026-07-17 |\n| `account-security` | draft | — | — | 2026-07-17 |\n\n\n## <a id=\"sec-openq\"></a>10. Open Questions (tổng hợp)\n\n> Gom từ các mục **Open Questions** rải rác trong tài liệu (SRS spec, từng function, ...). Nội dung gốc vẫn nằm nguyên trong file MD — đây chỉ là bản tổng hợp để dễ đọc.\n\n### SRS Spec\n\n- [ ] Có cần thêm bước xác minh quyền sở hữu khi tự liên kết Google vào tài khoản email trùng (để giảm rủi ro chiếm tài khoản), hay giữ tự liên kết như hiện tại và chỉ theo dõi qua nhật ký? (rủi ro đã ghi ở Mục 11 Assumptions + brainstorm Mục 9)\n- [ ] \"Ngày\" trong giới hạn gửi lại 5 lần/ngày tính theo lịch (00:00 local) hay theo cửa sổ trượt 24 giờ? [NEEDS CLARIFICATION: định nghĩa mốc reset của quota gửi lại email]\n- [ ] Bộ đếm đăng nhập sai (ngưỡng captcha 3 / khóa 5) tính \"liên tiếp\" reset khi nào — sau một lần đăng nhập thành công, hay có tự giảm theo thời gian? [NEEDS CLARIFICATION: điều kiện reset bộ đếm sai]\n- [ ] Khi vận hành/admin vô hiệu hóa (disable) một tài khoản đang đăng nhập, đây có phải hành động trong scope auth không, và nếu có thì ai được phép và ghi vết ở đâu? (brainstorm Mục 6.3 nhắc \"Admin disable\" nhưng chưa có FR)\n\n";
      const md = window.markdownit({ html: true, linkify: true, breaks: false });
      const defaultFence = md.renderer.rules.fence.bind(md.renderer.rules);
      md.renderer.rules.fence = (tokens, idx, options, env, slf) => {
        const token = tokens[idx];
        if (token.info.trim() === 'mermaid') {
          return `<pre class="mermaid">${token.content}</pre>`;
        }
        return defaultFence(tokens, idx, options, env, slf);
      };
      document.getElementById('content').innerHTML = md.render(MD_SOURCE);
    }

    // === Build nested TOC đa cấp (H2 → H3 → H4) theo đúng phân cấp heading ===
    const toc = document.getElementById('toc');
    // Lấy H2/H3/H4 (bỏ heading trong cover page). H4 cho thấy mục con sâu (vd
    // "## Screen: ..." trong wireframe demote thành H4) — TOC nest đúng theo cấp.
    const headings = Array.from(document.querySelectorAll('main h2, main h3, main h4'))
                          .filter(h => !h.closest('.cover'));
    // Stack các <ul> theo cấp: stack[L] = ul chứa item cấp L. Gốc toc = cấp 1 (giữ H2).
    const listStack = { 1: toc };   // toc là <ol> gốc
    let counter = 0;

    headings.forEach((h) => {
      const level = parseInt(h.tagName[1], 10);   // 2 | 3 | 4
      const id = `sec-${++counter}`;
      h.id = id;

      const li = document.createElement('li');
      li.className = 'toc-item';
      li.dataset.level = level;
      const row = document.createElement('div');
      row.className = 'toc-row';
      const toggle = document.createElement('span');
      toggle.className = 'toggle leaf';   // 'leaf' cho tới khi có con
      toggle.textContent = '▾';
      const a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      row.appendChild(toggle);
      row.appendChild(a);
      li.appendChild(row);
      const childUl = document.createElement('ul');
      childUl.className = 'toc-children';
      li.appendChild(childUl);

      // Gắn vào parent = ul của cấp NGAY TRÊN đang mở (level-1); không có thì leo lên tiếp.
      let parentUl = null;
      for (let L = level - 1; L >= 1; L--) { if (listStack[L]) { parentUl = listStack[L]; break; } }
      (parentUl || toc).appendChild(li);
      // Parent li không còn là leaf → hiện toggle.
      const parentLi = (parentUl || toc).closest('li.toc-item');
      if (parentLi) parentLi.querySelector(':scope > .toc-row > .toggle').classList.remove('leaf');

      // Cấp hiện tại giờ mở childUl này; xóa mọi cấp sâu hơn khỏi stack.
      listStack[level] = childUl;
      for (let L = level + 1; L <= 6; L++) delete listStack[L];

      toggle.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        li.classList.toggle('collapsed');
      });
    });

    function setAllTocCollapsed(collapsed) {
      // Chỉ gập/mở các item CÓ con (leaf giữ nguyên).
      toc.querySelectorAll('li.toc-item').forEach(li => {
        const t = li.querySelector(':scope > .toc-row > .toggle');
        if (t && !t.classList.contains('leaf')) li.classList.toggle('collapsed', collapsed);
      });
    }

    // === Click link nội bộ #anchor (TOC LẪN trong nội dung) → cuộn mượt tới mục ===
    // Bắt ở document để phủ cả link "chi tiết ở erd.md" (đã đổi thành #sec-erd) trong
    // content, không chỉ TOC. Anchor có thể là <a id> động (sec-N) hoặc cố định (sec-erd...).
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a[href^="#"]');
      if (!a) return;
      const id = a.getAttribute('href').slice(1);
      const target = document.getElementById(id) ||
                     document.querySelector(`main [id="${id}"]`);
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + id);
      }
    });

    // === Scroll-spy: highlight mục đang xem + mọi tổ tiên của nó ===
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          toc.querySelectorAll('li.active').forEach(el => el.classList.remove('active'));
          const link = toc.querySelector(`a[href="#${entry.target.id}"]`);
          if (link) {
            // Đánh dấu item hiện tại + leo lên mọi cấp cha (nested).
            let li = link.closest('li.toc-item');
            while (li) { li.classList.add('active'); li = li.parentElement.closest('li.toc-item'); }
          }
        }
      });
    }, { rootMargin: '-10% 0px -70% 0px', threshold: 0 });
    document.querySelectorAll('main h2, main h3, main h4').forEach(h => obs.observe(h));

    // === Mermaid render (CHỈ online) + zoom modal ===
    if (!OFFLINE && window.mermaid) {
      mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
      (async () => {
        const blocks = Array.from(document.querySelectorAll('pre.mermaid'));
        for (let i = 0; i < blocks.length; i++) {
          const el = blocks[i];
          const code = el.textContent;
          try {
            const { svg } = await mermaid.render(`mmd-${i}`, code);
            el.innerHTML = svg;
            el.dataset.processed = '1';
          } catch (err) {
            console.error(`Mermaid block #${i} failed:`, err.message || err);
            el.innerHTML = `<div style="color:#b00;font-family:monospace;font-size:12px;padding:8px;border:1px solid #b00;border-radius:4px;text-align:left;">⚠ Mermaid render lỗi: ${(err.message||err).toString().split('\n')[0]}<br><pre style="white-space:pre-wrap;margin-top:8px;">${code.replace(/</g,'&lt;')}</pre></div>`;
          }
        }
        attachMermaidZoom();
      })();
    } else {
      // offline: SVG đã inline sẵn server-side, chỉ cần gắn click-zoom.
      attachMermaidZoom();
    }

    function attachMermaidZoom() {
      document.querySelectorAll('.mermaid svg, pre.mermaid svg').forEach(svg => {
        if (svg.dataset.zoomAttached) return;
        svg.dataset.zoomAttached = '1';
        svg.addEventListener('click', () => openMermaidModal(svg));
      });
    }

    function openMermaidModal(svg) {
      const modal = document.getElementById('mermaid-modal');
      const inner = modal.querySelector('.modal-svg');
      const clone = svg.cloneNode(true);
      clone.style.maxWidth = 'none';
      clone.style.maxHeight = 'none';
      clone.setAttribute('width', '100%');
      clone.setAttribute('height', '100%');
      inner.innerHTML = '';
      inner.appendChild(clone);
      modal.classList.add('open');
      // svg-pan-zoom chỉ có online (CDN). Offline: hiển thị to trong modal, không pan/zoom lib
      // (degrade nhẹ — vẫn xem được full diagram, ESC/click nền để đóng).
      if (!OFFLINE && window.svgPanZoom) {
        requestAnimationFrame(() => {
          modalPanZoom = svgPanZoom(clone, {
            zoomEnabled: true, controlIconsEnabled: false,
            fit: true, center: true, minZoom: 0.3, maxZoom: 20,
            zoomScaleSensitivity: 0.3
          });
        });
      }
    }

    function closeMermaidModal() {
      const modal = document.getElementById('mermaid-modal');
      if (modalPanZoom) { modalPanZoom.destroy(); modalPanZoom = null; }
      modal.querySelector('.modal-svg').innerHTML = '';
      modal.classList.remove('open');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.getElementById('mermaid-modal').classList.contains('open')) {
        closeMermaidModal();
      }
    });
  </script>
</body>
</html>
